; ============================================================
; YueE2 音乐生成系统 - 模型路径配置
; 位置：yue2-webui 目录（随 WebUI 项目走）
; 规则：
;   - 相对路径基于 Yue2 系统根目录（本文件上一级）解析；也可填绝对路径
;   - 本文件缺失或某项未填写时，回退到内置默认值
;   - 修改后重启 WebUI 生效
; ============================================================

[models]
; 主模型 + VAE 模型所在目录
models_dir = models

; 主模型 GGUF 文件名（位于 models_dir 下）
main_model = yue2-3b-q8_0.gguf

; VAE 模型 GGUF 文件名（位于 models_dir 下）
vae_model = yue2-vae-f16.gguf

; SheetSage2 转谱模型路径（音频转ABC乐谱）
sheetsage2_path = audio-cpp/models/SheetSage2-GGUF/sheetsage2-orig.gguf

[voice]
; 音色工坊（音轨分离 + 参考音色翻唱）配置
; enabled = false 时主 app 隐藏音色工坊 Tab 并拒收相关任务
enabled = true

; worker 起始端口；被占用时自动 +1 重试（最多偏移 5）
worker_port = 8190

; Seed-VC 源码目录（需先按 Docs/setup.md「音色工坊」章节完成独立环境安装）
; 留空时自动探测 ${系统根}/seed-vc（阶段0 默认位置）
seedvc_dir = 

; 输入音频时长上限（分钟），超限拒绝并提示
max_input_minutes = 8
