/* 曲线拖拽：按 x 就近吸附到某个手柄，纵向拖动改该段增益 */
function attachEqCurve(t, cv) {
  cv.tabIndex = 0;
  let drag = null;
  const gainAt = (ev) => {
    const r = cv.getBoundingClientRect();
    return eqDb(clampNum(ev.clientY - r.top, 0, r.height), r.height);
  };
  cv.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0) return;
    ev.preventDefault();
    const r = cv.getBoundingClientRect();
    const px = ev.clientX - r.left;
    drag = EQ_HANDLES[0];
    let bd = Infinity;
    EQ_HANDLES.forEach((hd) => {
      const d = Math.abs(eqX(hd.hz, r.width) - px);
      if (d < bd) { bd = d; drag = hd; }
    });
    try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* 指针不可捕获时退化为普通拖拽 */ }
    setEqGain(t, drag, gainAt(ev));
  });
  cv.addEventListener("pointermove", (ev) => { if (drag) setEqGain(t, drag, gainAt(ev)); });
  const end = (ev) => {
    if (!drag) return;
    drag = null;
    try { cv.releasePointerCapture(ev.pointerId); } catch (e) { /* 已释放 */ }
  };
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", end);
  // 键盘：↑↓ 改最近一次操作的手柄（默认中频），Home 复位三段
  cv.addEventListener("keydown", (ev) => {
    let d = 0;
    if (ev.code === "ArrowUp") d = .5; else if (ev.code === "ArrowDown") d = -.5;
    else if (ev.code === "Home") {
      ev.preventDefault();
      EQ_HANDLES.forEach((hd) => setEqGain(t, hd, 0));
      return;
    } else return;
    ev.preventDefault();
    setEqGain(t, drag || EQ_HANDLES[1], t[(drag || EQ_HANDLES[1]).key] + d);
  });
}

/* 声像读数：C（居中）/ L50 / R50 */
function fmtPan(v) {
  return Math.abs(v) < 0.005 ? "C" : (v < 0 ? "L" : "R") + Math.round(Math.abs(v) * 100);
}
function clampNum(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function fmtTime(sec) {
  const s = Math.max(0, sec || 0);
  const m = Math.floor(s / 60);
  return m + ":" + (s - m * 60).toFixed(1).padStart(4, "0");
}
/* 该轨是否发声（与 buildPayload 的 mute 语义保持一致） */
function isAudible(t) {
  const anySolo = S.tracks.some((x) => x.solo);
  return !t.mute && (!anySolo || t.solo);
}
/* 播放区间：有效全局选区 → 只播选区；否则播整曲 */
function playRange() {
  if (S.dur > 0 && S.sel[1] > S.sel[0] + 0.005) {
    return [Math.max(0, S.sel[0]), Math.min(S.dur, S.sel[1])];
  }
  return [0, S.dur];
}
/* 轨道在时间轴上的片段：有裁切按切片，无裁切按整轨一段 */
function trackSegments(t) {
  if (t.clips && t.clips.length) {
    return t.clips.map((c) => ({
      start: c.start, end: c.start + (c.out - c.in), srcIn: c.in,
      fadeIn: c.fade_in || 0, fadeOut: c.fade_out || 0,
    }));
  }
  return [{ start: 0, end: S.dur, srcIn: 0, fadeIn: t.fadeIn || 0, fadeOut: t.fadeOut || 0 }];
}
/* 把轨节点增益设成「轨增益 × 发声门控」；播放中切换即时生效（短时间常数避免爆音） */
function applyTrackGain(t) {
  if (!t.node || !S.ctx) return;
  const v = isAudible(t) ? linGain(t.gain) : 0;
  t.node.gain.setTargetAtTime(v, S.ctx.currentTime, 0.01);
}
function syncTransportLabels() {
  const el = $("tp-play");
  el.textContent = S.playing ? "⏸" : "▶";
  el.title = T(S.playing ? "暂停" : "播放");
  $("tp-stop").textContent = "■";     // 用实心方块，避免 ⏹ 在部分字体下过小/缺字形
  $("tp-stop").title = T("停止");
  // 走带状态：播放中给工具条挂 .on，让时钟读数转为主题色，一眼看出是否在走带
  const tb = $("transport");
  if (tb) tb.classList.toggle("on", !!S.playing);
}
/* 带下载进度的取文件：服务端 FileResponse 会带 Content-Length，故可显示百分比。
   远端大 WAV（单轨 60–100MB）下载是主要瓶颈，进度提示避免被误以为卡死。 */
async function fetchWithProgress(url, onPct) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  const total = Number(resp.headers.get("Content-Length") || 0);
  if (!resp.body || !total) return await resp.arrayBuffer();   // 无长度信息：退化为一次性读取
  const reader = resp.body.getReader();
  const chunks = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    got += value.length;
    onPct(got / total);
  }
  const buf = new Uint8Array(got);
  let off = 0;
  chunks.forEach((c) => { buf.set(c, off); off += c.length; });
  return buf.buffer;
}
/* 顺序下载并解码全部轨音频；返回 false 表示有轨失败 */
async function ensureBuffers() {
  const ctx = audioCtx();
  const todo = S.tracks.filter((t) => !S.bufs[t.path]);
  if (!todo.length) return true;
  for (let i = 0; i < todo.length; i++) {
    const t = todo[i];
    const name = t.label || t.name;
    const pos = (i + 1) + "/" + todo.length;
    $("tp-msg").textContent = T("正在下载音频") + " " + pos + " · " + name + " 0%";
    try {
      const ab = await fetchWithProgress("/api/mix/audio?path=" + enc(t.path), (pct) => {
        $("tp-msg").textContent = T("正在下载音频") + " " + pos + " · " + name + " " + Math.round(pct * 100) + "%";
      });
      $("tp-msg").textContent = T("正在解码音频") + " " + pos + " · " + name;
      S.bufs[t.path] = await ctx.decodeAudioData(ab);
    } catch (e) {
      $("tp-msg").textContent = T("解码失败") + ": " + name;
      return false;
    }
  }
  $("tp-msg").textContent = "";
  return true;
}
function stopNodes() {
  S.nodes.forEach((n) => {
    try { n.stop(); } catch (e) { /* 已自然结束 */ }
    try { n.disconnect(); } catch (e) { /* 忽略 */ }
  });
  S.nodes = [];
  // 每轨的增益节点与音质/音效节点链一并断开，避免反复重排时节点在 master 上堆积
  S.tracks.forEach((t) => {
    if (t.fx) {
      const nd = t.fx.nodes;
      Object.keys(nd).forEach((k) => {
        const n = nd[k];
        if (!n) return;
        const list = Array.isArray(n) ? n : [n];        // taps 是 {d, g} 数组
        list.forEach((x) => {
          Object.keys(x).forEach((kk) => {
            const node = x[kk];
            if (node && node.disconnect) { try { node.disconnect(); } catch (e) { /* 忽略 */ } }
          });
        });
      });
      t.fx = null;
    }
    // 释放电平表取样链；保留 t.mtr 残值，让表回落动画由 meterLoop 收尾
    if (t.meter) {
      disposeMeterTap(t.meter.in); disposeMeterTap(t.meter.out);
      t.meter = null;
    }
    if (t.node) { try { t.node.disconnect(); } catch (e) { /* 忽略 */ } }
    t.node = null;
  });
}
/* 调度一轮播放：时间轴 startTime 对应音频时钟 atCtx；atCtx 可落在未来（循环预调度） */
function scheduleIteration(startTime, atCtx) {
  const ctx = S.ctx, span = S.playEnd - startTime;
  if (span <= 0.002) return;
  S.tracks.forEach((t) => {
    const buf = S.bufs[t.path];
    if (!buf || !t.node) return;
    trackSegments(t).forEach((seg) => {
      const s = Math.max(seg.start, startTime), e = Math.min(seg.end, S.playEnd);
      if (e - s <= 0.002) return;
      const offset = seg.srcIn + (s - seg.start);
      if (offset >= buf.duration) return;
      const dur = Math.min(e - s, buf.duration - offset);
      if (dur <= 0.002) return;
      const when = atCtx + (s - startTime);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const env = ctx.createGain();
      src.connect(env); env.connect(t.fx ? t.fx.head : t.node);   // 音质链在轨增益之前
      if (t.meter) env.connect(t.meter.in.split);                 // IN 表取音质链之前的信号（含淡变包络）
      // 淡变包络：按片段边界生成折线，起点已在淡入区内则从当前值续接
      const segLen = seg.end - seg.start;
      const gAt = (p) => {                       // p 为片段内相对位置（秒）
        let g = 1;
        if (seg.fadeIn > 0 && p < seg.fadeIn) g = Math.max(0, p / seg.fadeIn);
        if (seg.fadeOut > 0 && p > segLen - seg.fadeOut) {
          g = Math.min(g, Math.max(0, (segLen - p) / seg.fadeOut));
        }
        return g;
      };
      const pts = [];
      if (seg.fadeIn > 0) pts.push([atCtx + (seg.start + seg.fadeIn - startTime), 1]);
      if (seg.fadeOut > 0) {
        pts.push([atCtx + (seg.end - seg.fadeOut - startTime), 1]);
        pts.push([atCtx + (seg.end - startTime), 0]);
      }
      env.gain.setValueAtTime(gAt(s - seg.start), when);
      pts.filter((p) => p[0] > when + 0.0001)
        .sort((x, y) => x[0] - y[0])
        .forEach((p) => env.gain.linearRampToValueAtTime(p[1], p[0]));
      src.start(when, offset, dur);
      src._endAt = when + dur;
      S.nodes.push(src);
    });
  });
}
function currentPos() {
  if (!S.playing || !S.ctx) return S.pos;
  const span = S.playEnd - S.playStart;
  if (span <= 0) return S.playStart;
  let d = Math.max(0, S.ctx.currentTime - S.t0);
  d = S.loop ? d % span : Math.min(d, span);
  return S.playStart + d;
}
/* 播放头：所有轨叠加的同一条竖线 + 时间码 */
function updatePlayheads() {
  const d = S.dur || 0;
  const pos = Math.min(S.pos, d);
  S.tracks.forEach((t) => {
    const el = t.playheadEl;
    if (!el) return;
    const w = el.parentElement.clientWidth || 0;
    el.style.transform = "translateX(" + (d > 0 ? (pos / d) * w : 0) + "px)";
  });
  $("tp-time").textContent = fmtTime(pos);   // 时钟拆分：当前位置单独强调
  $("tp-dur").textContent = fmtTime(d);      // 总时长弱化显示
}
function tick(gen) {
  if (!S.playing || gen !== S.gen) return;      // 已停止/已重排：旧回调直接作废
  const span = S.playEnd - S.playStart;
  if (!S.loop && S.ctx.currentTime - S.t0 >= span) {
    stopNodes();
    S.playing = false;
    S.pos = S.playEnd;
    $("tp-msg").textContent = "";
  } else {
    S.pos = currentPos();
  }
  syncTransportLabels();
  updatePlayheads();
  if (S.playing) S.raf = requestAnimationFrame(() => tick(gen));
}
/* 从时间轴 pos 处开始（或重新开始）统一播放 */
async function playFrom(pos) {
  if (!S.tracks.length || S.dur <= 0) { $("tp-msg").textContent = T("请先选择素材"); return; }
  if (S.playing) { stopNodes(); S.playing = false; }
  $("solo-audio").pause();                                    // 与单轨试听互斥
  if (!(await ensureBuffers())) return;
  const ctx = audioCtx();
  try { if (ctx.state === "suspended") await ctx.resume(); } catch (e) { /* 忽略 */ }
  const [a, b] = playRange();
  let start = Math.max(a, Math.min(b, pos));
  if (start >= b - 0.005) start = a;                          // 已在末尾 → 回到区间起点
  if (b - start <= 0.005) return;
  stopNodes();
  S.playStart = start; S.playEnd = b;
  S.t0 = ctx.currentTime + 0.05;
  S.nextLoopAt = S.t0 + (b - start);
  // 每轨：音质节点链 → 增益节点（承载轨增益 + Mute/Solo 门控，播放中可实时改）
  S.tracks.forEach((t) => {
    const g = ctx.createGain();
    g.gain.value = isAudible(t) ? linGain(t.gain) : 0;
    g.connect(S.master);
    t.node = g;
    t.fx = buildFxChain(ctx);
    t.fx.tail.connect(g);
    applyFxParams(ctx, t.fx.nodes, t);
    // 电平表取样链（旁路，不串进音频链路）：IN 取音质链之前、OUT 取轨增益之后（含 Mute/Solo 门控）
    t.meter = { in: mkMeterTap(ctx), out: mkMeterTap(ctx), fx: t.fx };
    g.connect(t.meter.out.split);
    if (!t.mtr) t.mtr = newMtrState();        // 只建一次：保留上次残值，由 meterLoop 回落收尾
  });
  scheduleIteration(start, S.t0);
  S.playing = true;
  S.pos = start;
  meterLoop();                               // 启动表刷新（播放中持续，停止后自动收尾归零）
  syncTransportLabels();
  updatePlayheads();
  S.gen++;                                   // 作废旧动画帧，保证只有一个 tick 循环
  const gen = S.gen;
  if (S.raf) cancelAnimationFrame(S.raf);
  S.raf = requestAnimationFrame(() => tick(gen));
}
function pausePlayback() {
  if (!S.playing) return;
  S.pos = currentPos();
  stopNodes();
  S.playing = false;
  S.gen++;
  if (S.raf) { cancelAnimationFrame(S.raf); S.raf = 0; }
  syncTransportLabels();
  updatePlayheads();
}
/* 停止：回到播放区间起点（DAW 惯例），而不是停在当前位置 */
function stopPlayback() {
  S.gen++;
  if (S.raf) { cancelAnimationFrame(S.raf); S.raf = 0; }
  stopNodes();
  S.playing = false;
  S.pos = playRange()[0];
  $("tp-msg").textContent = "";
  syncTransportLabels();
  updatePlayheads();
}
function togglePlay() {
  if (S.playing) pausePlayback();
  else playFrom(S.pos);
}
/* 单击波形定位播放头；播放中定位 = 从新位置继续播 */
function seekTo(time) {
  const [a, b] = playRange();
  S.pos = Math.max(a, Math.min(b, time));
  if (S.playing) playFrom(S.pos);
  else updatePlayheads();
}
/* 循环 lookahead：在每轮结束前 ~0.5s 预排下一轮，保证循环接缝不留空档 */
setInterval(() => {
  if (!S.playing || !S.ctx) return;
  // 清理已播完的节点引用，避免长时间循环时数组无限膨胀
  if (S.nodes.length > 40) S.nodes = S.nodes.filter((n) => n._endAt > S.ctx.currentTime);
  if (!S.loop) return;
  const span = S.playEnd - S.playStart;
  if (span <= 0.01) return;
  if (S.nextLoopAt - S.ctx.currentTime < 0.5) {
    scheduleIteration(S.playStart, S.nextLoopAt);
    S.nextLoopAt += span;
  }
}, 200);

/* 在波形上拖拽选择全局区间（所有轨共用同一时间轴）；未拖动的单击 = 定位播放头 */
function attachSelection(cv) {
  let dragging = false, anchor = 0, downX = 0, moved = false;
  const timeAt = (ev) => {
    const rect = cv.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, ev.clientX - rect.left));
    return rect.width > 0 ? (x / rect.width) * S.dur : 0;
  };
  cv.addEventListener("pointerdown", (ev) => {
    if (S.dur <= 0) return;
    dragging = true; moved = false; downX = ev.clientX; anchor = timeAt(ev);
    try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* 忽略：部分浏览器不支持 */ }
  });
  cv.addEventListener("pointermove", (ev) => {
    if (!dragging) return;
    if (!moved && Math.abs(ev.clientX - downX) < 4) return;   // 阈值内仍视为单击
    moved = true;
    const p = timeAt(ev);
    S.sel = [Math.min(anchor, p), Math.max(anchor, p)];
    syncSelInputs(); redrawAll();
  });
  const stop = (ev) => {
    if (!dragging) return;
    dragging = false;
    try { cv.releasePointerCapture(ev.pointerId); } catch (e) { /* 忽略 */ }
    if (!moved) { seekTo(timeAt(ev)); return; }               // 单击：定位（保留原选区）
    if (S.playing) playFrom(playRange()[0]);                  // 播放中改选区 → 从新区间重播
  };
  cv.addEventListener("pointerup", stop);
  cv.addEventListener("pointercancel", () => { dragging = false; });
}
function syncSelInputs() {
  $("sel-start").value = r3(S.sel[0]);
  $("sel-end").value = r3(S.sel[1]);
}

/* ==================================================================== 载入素材 */
/* 逐轨串行解码波形，避免并发拉起多个 ffmpeg 争抢磁盘 */
async function loadPeaks() {
  for (const t of S.tracks) {
    const data = await getJSON(`/api/mix/peaks?path=${enc(t.path)}`);
    t.peaks = data.ok ? (data.peaks || []) : [];
    if (data.ok && data.duration > 0) S.dur = Math.max(S.dur, data.duration);
    drawTrack(t);
  }
  $("sel-end").value = r3(S.dur);
  S.sel = [0, 0];
  renderRuler();          // 时长确定后重建共享刻度尺（波形网格线依赖 S.ticks）
  redrawAll();
  updatePlayheads();      // 时长确定后复位播放头/时间码
}

async function loadTracks() {
  const idx = $("source").value;
  const src = S.sources[parseInt(idx, 10)];
  if (!src) { setMsg(T("请先选择素材"), "err"); return; }
  setMsg(T("正在载入波形") + "...");
  $("load").disabled = true;
  try {
    S.rootTaskId = src.task_id || "";
    S.dur = 0;
    buildTracks(src.tracks);
    $("editor").hidden = false;
    await loadPeaks();
    setMsg("");
  } catch (e) {
    setMsg(String(e), "err");
  } finally {
    $("load").disabled = false;
  }
}

/* ==================================================================== 工程持久化 */
async function loadProjects() {
  const data = await getJSON("/api/mix/projects");
  S.projects = data.ok ? (data.projects || []) : [];
  const sel = $("project");
  const prev = sel.value;
  sel.textContent = "";
  S.projects.forEach((p, i) => {
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = `${p.name} · ${p.track_count} ${T("音轨")} · ${p.saved_at}`;
    sel.appendChild(opt);
  });
  if (prev && S.projects[prev]) sel.value = prev;
  return data;
}

/* 把已保存工程的轨道状态回填到界面控件（增益/静音/淡变/切片） */
function applyTrackState(t, st) {
  t.gain = Number(st.gain_db) || 0;
  t.gainEl.value = String(t.gain);
  t.gainValEl.textContent = t.gain.toFixed(1) + " dB";
  t.mute = !!st.mute;
  t.muteEl.checked = t.mute;
  const clips = Array.isArray(st.clips) ? st.clips : [];
  t.clips = clips.map((c) => ({
    start: Number(c.start) || 0,
    in: Number(c.in) || 0,
    out: c.out === null || c.out === undefined ? 0 : Number(c.out) || 0,
    fade_in: Number(c.fade_in) || 0,
    fade_out: Number(c.fade_out) || 0,
  }));
  // 淡变值优先取切片内的值，便于界面显示与再次编辑
  const c0 = t.clips[0];
  t.fadeIn = c0 ? c0.fade_in : 0;
  t.fadeOut = c0 ? c0.fade_out : 0;
  t.finEl.value = String(t.fadeIn);
  t.foutEl.value = String(t.fadeOut);
  // 音质参数（P1）：工程回灌后同步控件显示与实时节点链
  t.pan = clampNum(Number(st.pan) || 0, -1, 1);
  t.eqLow = clampNum(Number(st.eq_low) || 0, -15, 15);
  t.eqMid = clampNum(Number(st.eq_mid) || 0, -15, 15);
  t.eqHigh = clampNum(Number(st.eq_high) || 0, -15, 15);
  t.hpf = clampNum(Number(st.hpf) || 0, 0, 2000);
  t.lpf = clampNum(Number(st.lpf) || 0, 0, 20000);
  // 回灌只刷新控件显示，不广播 onChange（参数值上面已直接写入 track，节点链随后统一同步）
  t.panEl.setV(t.pan);
  t.eqLowEl.setV(t.eqLow);
  t.eqMidEl.setV(t.eqMid);
  t.eqHighEl.setV(t.eqHigh);
  t.hpfEl.setV(t.hpf);
  t.lpfEl.setV(t.lpf);
  // 音效参数（P2）：压缩（阈值/比率）+ 回声（延迟/反馈/混合），回灌后同步控件与节点链
  t.compTh = clampNum(Number(st.comp_th) || 0, -60, 0);
  t.compRatio = clampNum(Number(st.comp_ratio) || 1, 1, 20);
  // 延迟/反馈默认 0（中性）；延迟为 0 且混合 > 0 时，前后端一致地回退 FX_ECHO_DEF_MS
  t.echoDelay = clampNum(Number(st.echo_delay) || 0, 0, 2000);
  t.echoFb = clampNum(Number(st.echo_fb) || 0, 0, 0.95);
  t.echoMix = clampNum(Number(st.echo_mix) || 0, 0, 1);
  t.compThEl.setV(t.compTh);
  t.compRatioEl.setV(t.compRatio);
  t.echoDelayEl.setV(t.echoDelay);
  t.echoFbEl.setV(t.echoFb);
  t.echoMixEl.setV(t.echoMix);
  // 旁通：工程未记录该字段时按「正常」处理（向后兼容旧工程）
  t.fxOn = st.fx_on === undefined ? true : !!st.fx_on;
  if (t.fxToolsPaint) t.fxToolsPaint();
  applyTrackFx(t);
  drawEqCurve(t);                            // 三段 EQ / 高通 / 低通回灌后重绘频响曲线
  updateTrackState(t);
  drawTrack(t);
}

async function saveProject() {
  if (!S.tracks.length) { setPrjMsg(T("请先选择素材"), "err"); return; }
  const name = ($("proj").value || "").trim();
  setPrjMsg("...");
  try {
    const data = await postJSON("/api/mix/project", { project: buildPayload(), name: name });
    if (!data.ok) { setPrjMsg((data.error || T("渲染失败")), "err"); return; }
    setPrjMsg(T("工程已保存") + ": " + data.name, "ok");
    await loadProjects();
  } catch (e) {
    setPrjMsg(String(e), "err");
  }
}

async function openProject() {
  const rec = S.projects[parseInt($("project").value, 10)];
  if (!rec) { setPrjMsg(T("请先选择素材"), "err"); return; }
  $("open-proj").disabled = true;
  setPrjMsg(T("正在载入波形") + "...");
  try {
    const data = await getJSON("/api/mix/project?path=" + enc(rec.path));
    if (!data.ok) { setPrjMsg(data.error || T("渲染失败"), "err"); return; }
    const p = data.project || {};
    S.rootTaskId = p.source_root_task_id || "";
    S.dur = Number(p.duration) || 0;
    const items = (p.tracks || []).map((t) => ({
      type: t.id, label: t.name || t.id, path: t.src, name: baseName(t.src),
    }));
    buildTracks(items);
    $("editor").hidden = false;
    const master = p.master || {};
    if (master.loudness_target !== undefined) $("loud").value = master.loudness_target;
    if (master.true_peak !== undefined) $("tp").value = master.true_peak;
    await loadPeaks();
    // 波形就绪后再回填编辑状态（此时 S.dur 已确定，切片压暗与选区绘制才准确）
    (p.tracks || []).forEach((t, i) => { if (S.tracks[i]) applyTrackState(S.tracks[i], t); });
    setPrjMsg(T("工程已载入") + ": " + (data.name || ""), "ok");
  } catch (e) {
    setPrjMsg(String(e), "err");
  } finally {
    $("open-proj").disabled = false;
  }
}

/* ==================================================================== 渲染 */
function buildPayload() {
  const anySolo = S.tracks.some((t) => t.solo);
  const tracks = S.tracks.map((t) => {
    let clips = t.clips.map((c) => ({
      start: r3(c.start), in: r3(c.in), out: r3(c.out),
      fade_in: r3(c.fade_in), fade_out: r3(c.fade_out),
    }));
    // 无切片但设了淡变：物化为整轨切片，让淡入淡出对整轨同样生效
    if (!clips.length && (t.fadeIn > 0 || t.fadeOut > 0) && S.dur > 0) {
      clips = [{ start: 0, in: 0, out: r3(S.dur), fade_in: r3(t.fadeIn), fade_out: r3(t.fadeOut) }];
    }
    return {
      id: t.key, name: t.label, src: t.path, gain_db: t.gain,
      mute: !!t.mute || (anySolo && !t.solo), clips: clips,
      // 音质参数（P1）：与 mix_render.parse_mix_project 的字段名/钳制区间一致
      pan: t.pan, eq_low: t.eqLow, eq_mid: t.eqMid, eq_high: t.eqHigh,
      hpf: t.hpf, lpf: t.lpf,
      // 音效参数（P2）：压缩（阈值/比率）+ 回声（延迟/反馈/混合），同样与后端字段名/钳制一致
      comp_th: t.compTh, comp_ratio: t.compRatio,
      echo_delay: t.echoDelay, echo_fb: t.echoFb, echo_mix: t.echoMix,
      // 旁通：false 时后端不生成任何音质/音效滤镜（参数仍随工程保存，便于恢复）
      fx_on: t.fxOn !== false,
    };
  });
  return {
    version: 1, sample_rate: 48000, duration: r3(S.dur),
    source_root_task_id: S.rootTaskId, tracks: tracks,
    master: {
      loudness_target: parseFloat($("loud").value) || -14,
      true_peak: parseFloat($("tp").value) || -1.5,
    },
  };
}

async function startRender() {
  if (S.taskId) return;
  if (!S.tracks.length) { setStatus(T("请先选择素材"), "err"); return; }
  setStatus(T("排队中") + "...");
  $("render").disabled = true;
  try {
    const resp = await fetch("/api/mix/render?project=" + enc($("proj").value.trim()), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(buildPayload()),
    });
    const data = await resp.json().catch(() => ({ ok: false, error: "invalid json" }));
    if (!data.ok) { setStatus(T("渲染失败") + ": " + (data.error || ""), "err"); return; }
    S.taskId = data.task_id;
    $("cancel").hidden = false;
    $("result").hidden = true;
    poll();
  } catch (e) {
    setStatus(String(e), "err");
  } finally {
    $("render").disabled = false;
  }
}

async function poll() {
  if (!S.taskId) return;
  try {
    const d = await getJSON("/api/mix/status?task_id=" + enc(S.taskId));
    if (!d.ok) { setStatus(T("渲染失败") + ": " + (d.error || ""), "err"); finishRender(); return; }
    if (d.status === "queued") {
      setStatus(T("排队中") + " #" + d.position);
    } else if (d.status === "running") {
      const pct = d.progress ? Math.round(d.progress.value * 100) : 0;
      setStatus(T("渲染中") + " " + pct + "%" + (d.progress && d.progress.desc ? " · " + d.progress.desc : ""));
    } else if (d.status === "completed" && d.output) {
      setStatus(T("渲染完成"), "ok");
      showResult(d.output);
      finishRender();
      loadSources(true);
      return;
    } else if (d.status === "cancelled") {
      setStatus(T("已取消"));
      finishRender();
      return;
    } else {
      setStatus(T("渲染失败") + ": " + (d.error || ""), "err");
      finishRender();
      return;
    }
  } catch (e) {
    setStatus(String(e), "err");
  }
  S.timer = setTimeout(poll, 1000);
}
function finishRender() {
  if (S.timer) { clearTimeout(S.timer); S.timer = null; }
  S.taskId = null;
  $("cancel").hidden = true;
}
function showResult(relPath) {
  $("result").hidden = false;
  $("result-audio").src = "/api/mix/audio?path=" + enc(relPath);
  const a = $("result-dl");
  a.href = "/api/mix/audio?path=" + enc(relPath) + "&download=1";
  a.textContent = T("下载");
}

async function cancelRender() {
  if (!S.taskId) return;
  const d = await getJSON("/api/mix/status?task_id=" + enc(S.taskId));
  if (!d.ok) return;
  try {
    await fetch("/api/mix/cancel", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task_id: S.taskId }),
    });
  } catch (e) { /* 忽略：下一轮轮询会给出最终状态 */ }
}

/* ==================================================================== 混音记录 */
function renderMixList(mixes) {
  const box = $("mix-list");
  box.textContent = "";
  if (!mixes.length) {
    const em = document.createElement("div");
    em.className = "empty";
    em.textContent = T("暂无混音记录");
    box.appendChild(em);
    return;
  }
  mixes.forEach((m) => {
    const row = document.createElement("div");
    row.className = "mixitem";
    const name = document.createElement("span");
    name.className = "mixname";
    name.textContent = m.name || m.task_id;
    row.appendChild(name);
    const au = document.createElement("audio");
    au.controls = true;
    au.src = "/api/mix/audio?path=" + enc(m.path);
    row.appendChild(au);
    const dl = document.createElement("a");
    dl.className = "dl";
    dl.href = "/api/mix/audio?path=" + enc(m.path) + "&download=1";
    dl.textContent = T("下载");
    row.appendChild(dl);
    const rn = document.createElement("button");
    rn.textContent = T("改名");
    rn.addEventListener("click", () => renameMix(m));
    row.appendChild(rn);
    const del = document.createElement("button");
    del.className = "danger";
    del.textContent = T("删除选中");
    del.addEventListener("click", () => deleteMix(m));
    row.appendChild(del);
    box.appendChild(row);
  });
}

async function renameMix(m) {
  const name = window.prompt(T("新名称"), m.name || "");
  if (name === null) return;
  const data = await postJSON("/api/mix/record",
    { action: "rename", task_id: m.task_id, name: name });
  if (!data.ok) { setMsg(data.error || T("删除失败"), "err"); return; }
  await loadSources(true);
}

async function deleteMix(m) {
  if (!window.confirm(T("删除该混音记录？文件将移入回收站。"))) return;
  const data = await postJSON("/api/mix/record", { action: "delete", task_id: m.task_id });
  if (!data.ok) { setMsg(data.error || T("删除失败"), "err"); return; }
  await loadSources(true);
}

/* ==================================================================== 主题跟随 */
/* 内嵌进 Gradio 时读取父页面主题（同源可直接访问父窗口） */
function syncParentTheme() {
  if (!S.embed) return;
  try {
    const pdoc = window.parent.document;
    const pbody = pdoc.body;
    let theme = null;
    // 首选：Gradio 把 dark 挂在 body（或 html）上 —— 暗色唯一标识，
    // 比解析背景色更稳，不受色值序列化格式影响。
    if (pbody.classList.contains("dark") || pdoc.documentElement.classList.contains("dark")) {
      theme = "dark";
    } else {
      // 次选：读父页的 Gradio 主题变量判定明暗。
      // 不能看父页 body 的 background-color —— 用户在暗色系统下用 ?__theme=light
      // （或页脚主题开关）强制亮色时，Gradio 仍会给 body 留一份暗色背景（media query 直写），
      // 据它判断会把子页错锁成暗色。--body-background-fill 才是真正跟随主题的变量
      // （亮=white，暗=#0f0f11）。变量值可能是 white/#rrggbb/rgb()/color() 等任意写法，
      // 统一交给 canvas 归一化成 #rrggbb 或 rgb() 后再算亮度。
      const lumOfColor = (cssColor) => {
        if (!cssColor) return null;
        const cvs = document.createElement("canvas").getContext("2d");
        const sentinel = "#010203";
        cvs.fillStyle = sentinel;
        cvs.fillStyle = cssColor;                    // 非法色值会保持 sentinel
        const hex = cvs.fillStyle;
        if (hex === sentinel) return null;
        if (/^#/.test(hex)) {
          return 0.299 * parseInt(hex.slice(1, 3), 16) +
                 0.587 * parseInt(hex.slice(3, 5), 16) +
                 0.114 * parseInt(hex.slice(5, 7), 16);
        }
        const m = hex.match(/[\d.]+/g);              // rgb()/rgba()
        if (!m || m.length < 3) return null;
        if (m.length > 3 && +m[3] === 0) return null; // 全透明视为无效
        return 0.299 * +m[0] + 0.587 * +m[1] + 0.114 * +m[2];
      };
      const pwin = pdoc.defaultView || window;
      const varOf = (name) => (pwin.getComputedStyle(pbody).getPropertyValue(name) || "").trim() || null;
      const bgOf = (el) => (el ? lumOfColor(pwin.getComputedStyle(el).backgroundColor) : null);
      let lum = lumOfColor(varOf("--body-background-fill"));
      if (lum === null) lum = lumOfColor(varOf("--background-fill-primary"));
      // 最后回退：父页自身背景（父页不是 Gradio 宿主时仍可用）；
      // 取不到就放弃（保持现状，不盲目判定暗色）。
      if (lum === null) lum = bgOf(pbody);
      if (lum === null) lum = bgOf(pdoc.documentElement);
      if (lum === null) return;
      theme = lum < 128 ? "dark" : "light";
    }
    if (document.documentElement.dataset.theme !== theme) {
      document.documentElement.dataset.theme = theme;
      redrawAll();  // 波形颜色取自 CSS 变量，主题变化后需重绘
    }
  } catch (e) { /* 父窗口不可访问时保持系统主题 */ }
}

/* ============================================================ 内嵌自适应高度 */
/* 内嵌进 Gradio Tab 时，父页给的是固定高度，导致内容在本页内滚动、外层标题与菜单
   无法随页面滚走，白白占用顶部空间。同源下可直接拿到自己的 iframe 元素（frameElement）
   并改写其高度：本页长多高，iframe 就多高，滚动交给父页统一处理。
   高度用 body 的 border-box 高度（而非 documentElement.scrollHeight）——后者会被
   视口高度撑大，短内容时无法回落，形成"只能长不能缩"的死锁。 */
let _fitScheduled = false;
let _fitObserver = null;
function fitParentHeight() {
  if (!S.embed) return;
  let fe = null;
  try { fe = window.frameElement; } catch (e) { fe = null; }
  if (!fe) return;
  const h = Math.ceil(document.body.getBoundingClientRect().height);
  if (!h) return;   // 父 Tab 隐藏时 body 未参与布局（矩形为 0），跳过以免误设成 0 高
  if (Math.abs(h - (parseFloat(fe.style.height) || 0)) > 1) fe.style.height = h + "px";
}
function watchEmbedHeight() {
  if (!S.embed) return;
  /* 合并到一帧内执行。注意不能拿 rAF 句柄当"已排队"哨兵：隐藏 iframe 里 rAF
     不会触发，句柄非 0 会让后续更新永久卡死（实测内嵌 Tab 内高度不再跟随内容）。
     因此用布尔标记 + 定时器兜底，保证任何情况下都会跑到一次。 */
  const kick = () => {
    if (_fitScheduled) return;
    _fitScheduled = true;
    const run = () => {
      if (!_fitScheduled) return;
      _fitScheduled = false;
      fitParentHeight();
    };
    requestAnimationFrame(run);
    setTimeout(run, 150);
  };
  if (window.ResizeObserver) {
    _fitObserver = new ResizeObserver(kick);   // 必须持有引用，否则可能被回收后不再回调
    _fitObserver.observe(document.body);
  }
  window.addEventListener("resize", kick);
  kick();
}

/* ==================================================================== 事件绑定 */
$("load").addEventListener("click", loadTracks);
$("refresh").addEventListener("click", () => loadSources(true));
$("refresh-mixes").addEventListener("click", () => loadSources(true));
$("save-proj").addEventListener("click", saveProject);
$("open-proj").addEventListener("click", openProject);
$("project").addEventListener("change", () => setPrjMsg(""));
$("apply-all").addEventListener("click", () => {
  const a = S.sel[0], b = S.sel[1];
  if (!(b > a)) { setMsg(T("区间无效"), "err"); return; }
  S.tracks.forEach((t) => {
    t.clips = [{ start: a, in: a, out: b, fade_in: t.fadeIn, fade_out: t.fadeOut }];
    updateTrackState(t); drawTrack(t);
  });
});
$("reset-all").addEventListener("click", () => {
  S.tracks.forEach((t) => { t.clips = []; updateTrackState(t); drawTrack(t); });
});
/* 取消选择区：清空选区 → 播放范围恢复整曲（输入框回到 0 ~ 时长，播放中则从起点重播） */
$("sel-clear").addEventListener("click", () => {
  S.sel = [0, 0];
  $("sel-start").value = r3(0);
  $("sel-end").value = r3(S.dur);
  redrawAll();
  if (S.playing) playFrom(playRange()[0]);
});
$("sel-start").addEventListener("change", () => {
  S.sel[0] = Math.max(0, parseFloat($("sel-start").value) || 0);
  S.sel[1] = Math.max(S.sel[0], S.sel[1]); redrawAll();
});
$("sel-end").addEventListener("change", () => {
  S.sel[1] = Math.max(0, parseFloat($("sel-end").value) || 0);
  S.sel[0] = Math.min(S.sel[0], S.sel[1]); redrawAll();
});
$("render").addEventListener("click", startRender);
$("cancel").addEventListener("click", cancelRender);
/* 统一 transport：一个播放/暂停、一个停止，所有轨同步 */
$("tp-play").addEventListener("click", togglePlay);
$("tp-stop").addEventListener("click", stopPlayback);
$("tp-loop").addEventListener("change", () => { S.loop = $("tp-loop").checked; });
/* 空格键 = 全局播放/暂停：在捕获阶段监听 window，点过任何组件后仍然生效。
   仅"文本类输入"（工程名等，空格有输入语义）放行；数字输入框/下拉/按钮/空白区域
   一律当作热键，避免点过控件后空格失效。长按不重复触发（ev.repeat）。 */
window.addEventListener("keydown", (ev) => {
  if (ev.code !== "Space" || ev.repeat) return;
  const el = document.activeElement;
  const tag = el ? el.tagName : "";
  const isTextInput = tag === "TEXTAREA" || (el && el.isContentEditable) ||
    (tag === "INPUT" && el.type === "text");
  if (isTextInput) return;
  ev.preventDefault();
  togglePlay();
}, true);
/* 窗口尺寸变化：防抖后重绘波形与频响曲线，并重建刻度尺（百分比定位会随宽度变化） */
let _rszTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(_rszTimer);
  _rszTimer = setTimeout(() => { renderRuler(); redrawAll(); updatePlayheads(); }, 120);
});
/* 单轨试听播放器状态 → 按钮符号统一刷新（播放中该轨 ⏸，其余 ▶） */
$("solo-audio").addEventListener("play", syncPreviewButtons);
$("solo-audio").addEventListener("pause", syncPreviewButtons);
$("solo-audio").addEventListener("ended", syncPreviewButtons);

/* 启动：内嵌模式标记 → 主题跟随 → 素材/工程清单（文案表由 sources 接口下发） */
(async () => {
  if (S.embed) document.documentElement.dataset.embed = "1";
  syncParentTheme();
  setInterval(syncParentTheme, 1500);
  watchEmbedHeight();                          // 内嵌时让 iframe 随内容长高（顶部菜单可滚走）
  try { await loadSources(false); } catch (e) { setMsg(String(e), "err"); }
  try { await loadProjects(); } catch (e) { setPrjMsg(String(e), "err"); }
  fitParentHeight();
})();
</script>
</body>
