<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multitrack Editor</title>
<!--
  多轨编辑器（M2 独立编辑页 / M3 工程持久化 + 内嵌适配）

  设计说明：
  - 结构：html 只保留骨架与说明，样式/脚本分别外链 multitrack.css / multitrack.js
    （同目录，带 ?v= 版本号查询串，改内容需递增版本号以破缓存）；
    页面本体由 app.py 以 /static/multitrack/ 路由下发，并带 Cache-Control: no-store。
  - 编辑粒度：轨间平衡（增益/静音/独奏）+ 全局选区裁切（每轨可"裁为选区/恢复整轨"）
    + 每轨淡入淡出；所有文案来自 /api/mix/sources 的 strings 字段（后端 i18n），
    本页不硬编码任何界面文案。
  - 本页只负责交互与波形显示，成品由后端 ffmpeg 按工程 JSON 离线渲染（mix_render）。
  - 统一播放（transport）：所有轨共用一个 AudioContext 与同一个 start(t0) 实现样本级同步，
    仅一套播放/暂停/停止；发声按 Solo > Mute > 默认发声（与渲染一致）；有全局选区只播选区；
    播放头由覆盖层竖线跟随；空格键播放/暂停、单击波形定位、可循环。
  - M3：编辑工程可保存/载入（outputs/mix_projects/，接口 /api/mix/projects|project）；
    混音记录可改名/删除（/api/mix/record）；带 ?embed=1 时内嵌进分离 Tab，
    并通过读取父窗口主题（body.dark 类，回退到背景亮度）跟随明暗主题（同源）。
-->
<link rel="stylesheet" href="/static/multitrack/multitrack.css?v=1">
</head>
<body>
  <!-- 旋钮盘面的径向渐变（供全部旋钮引用，集中定义避免重复 id） -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <radialGradient id="kbFill" cx="35%" cy="28%" r="78%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"></stop>
        <stop offset="55%" stop-color="#ffffff" stop-opacity=".18"></stop>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
      </radialGradient>
    </defs>
  </svg>

  <header class="pagehead">
    <h1 id="t-title"></h1>
    <p class="hint" id="t-hint"></p>
  </header>

  <!-- 素材与工程同排：两块窄卡片并排，避免纵向叠出大片空白 -->
  <div class="cardgrid">
    <section class="card">
      <div class="row">
        <label class="lb" id="t-src"></label>
        <select id="source"></select>
        <button id="load" class="primary"></button>
        <button id="refresh" class="ghost"></button>
        <span id="msg" class="msg"></span>
      </div>
    </section>

    <!-- 工程持久化：保存当前编辑状态 / 载入已保存工程（可脱离素材下拉单独使用） -->
    <section class="card">
      <div class="row">
        <label class="lb" id="t-prj"></label>
        <select id="project"></select>
        <button id="save-proj"></button>
        <button id="open-proj"></button>
        <span id="prj-msg" class="msg"></span>
      </div>
    </section>
  </div>

  <section class="card" id="editor" hidden>
    <div class="row">
      <label class="lb" id="t-sel"></label>
      <input id="sel-start" type="number" step="0.01" min="0" value="0">
      <span class="msg">–</span>
      <input id="sel-end" type="number" step="0.01" min="0" value="0">
      <span class="sep"></span>
      <button id="apply-all"></button>
      <button id="reset-all"></button>
      <button id="sel-clear" class="ghost"></button>
      <span id="sel-info" class="selinfo"></span>
    </div>
    <!-- 共享时间刻度尺：所有轨共用同一时间轴，刻度与波形网格线对齐 -->
    <div class="ruler" id="ruler"></div>
    <div id="tracks"></div>
    <!-- 统一 transport：播放/停止/循环为一个控制簇，所有轨共用同一时钟（标准 DAW 逻辑） -->
    <div class="row transport" id="transport">
      <label class="lb" id="t-transport"></label>
      <span class="tp-grp">
        <button id="tp-play" class="pl primary"></button>
        <button id="tp-stop" class="pl"></button>
        <label class="chk pill"><input id="tp-loop" type="checkbox" checked><span id="t-loop"></span></label>
      </span>
      <span class="tp-clock">
        <span id="tp-time">0:00.0</span><span class="tp-sep">/</span><span id="tp-dur">0:00.0</span>
      </span>
      <span id="tp-msg" class="msg tp-msg"></span>
    </div>
    <div class="row master">
      <label class="lb" id="t-master"></label>
      <span class="mg"><label class="msg" id="t-loud"></label>
        <input id="loud" type="number" step="0.5" min="-30" max="-5" value="-14"></span>
      <span class="mg"><label class="msg" id="t-tp"></label>
        <input id="tp" type="number" step="0.1" min="-6" max="-0.1" value="-1.5"></span>
      <span class="mg"><label class="msg" id="t-proj"></label>
        <input id="proj" type="text"></span>
      <button id="render" class="primary"></button>
      <button id="cancel" class="danger" hidden></button>
      <span id="status" class="msg"></span>
    </div>
    <div class="row" id="result" hidden>
      <label class="lb" id="t-preview"></label>
      <audio id="result-audio" controls></audio>
      <a id="result-dl" class="dl" href="#" download></a>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <label class="lb" id="t-mixes"></label>
      <button id="refresh-mixes" class="ghost"></button>
    </div>
    <div id="mix-list"></div>
  </section>

  <!-- 单轨试听：隐藏的共享播放器（配合每轨 ▶ 按钮，见 previewTrack） -->
  <audio id="solo-audio" hidden></audio>

<script src="/static/multitrack/multitrack.js?v=1"></script>
</body>
</html>
