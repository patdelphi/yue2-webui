<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multitrack Editor</title>
<!--
  多轨编辑器（M2 独立编辑页 / M3 工程持久化 + 内嵌适配）

  设计说明：
  - 单文件自包含（CSS/JS 内联），由 app.py 以 /static/multitrack/ 路由下发，
    并带 Cache-Control: no-store，改版后无需处理子资源版本号。
  - 编辑粒度：轨间平衡（增益/静音/独奏）+ 全局选区裁切（每轨可"裁为选区/恢复整轨"）
    + 每轨淡入淡出；所有文案来自 /api/mix/sources 的 strings 字段（后端 i18n），
    本页不硬编码任何界面文案。
  - 本页只负责交互与波形显示，成品由后端 ffmpeg 按工程 JSON 离线渲染（mix_render）。
  - 统一播放（transport）：所有轨共用一个 AudioContext 与同一个 start(t0) 实现样本级同步，
    仅一套播放/暂停/停止；发声按 Solo > Mute > 默认发声（与渲染一致）；有全局选区只播选区；
    播放头由覆盖层竖线跟随；空格键播放/暂停、单击波形定位、可循环。
  - M3：编辑工程可保存/载入（outputs/mix_projects/，接口 /api/mix/projects|project）；
    混音记录可改名/删除（/api/mix/record）；带 ?embed=1 时内嵌进分离 Tab，
    并通过读取父窗口主题（body.dark 类，回退到背景亮度）跟随明暗主题（同源）。
-->
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff; --fg: #1f2328; --muted: #6b7280; --line: #d8dee4;
    --card: #f7f8fa; --card-2: #ffffff; --accent: #3b82f6; --accent-fg: #ffffff;
    --wave: #3b82f6; --sel: rgba(59,130,246,.18); --sec: #eef2f7;
    --danger: #ef4444; --ok: #16a34a;
    /* —— 设计令牌：间距 / 圆角 / 控件高度 / 分层阴影 / 聚焦光圈 —— */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 18px; --sp-5: 24px;
    --r-lg: 14px; --r-md: 10px; --r-sm: 7px;
    --h-ctl: 28px;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.06);
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 12px -6px rgba(16,24,40,.14);
    --shadow-lg: 0 16px 32px -16px rgba(16,24,40,.30);
    --ring: 0 0 0 3px rgba(59,130,246,.22);
    --accent-soft: rgba(59,130,246,.10);
    /* FX 面板（专业效果器风）：面板底/描边/旋钮盘面/推子轨道 + 三个模块主色 */
    --panel: #eef1f5; --panel-line: #dde3ea; --knob-bg: #ffffff; --knob-track: #cfd8e3;
    --mod-eq: #3b82f6; --mod-dyn: #d97706; --mod-echo: #7c3aed; --mod-tool: #0d9488;
    /* 轨道色板（按轨索引循环）+ 波形网格线 */
    --trk-1: #3b82f6; --trk-2: #8b5cf6; --trk-3: #0ea5e9;
    --trk-4: #f59e0b; --trk-5: #ec4899; --trk-6: #10b981;
    --grid: rgba(16,24,40,.10);
  }
  /* 深色变量：系统偏好（父页面未指定主题时生效）+ 父页面显式指定 data-theme="dark" */
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #16181d; --fg: #e6e8eb; --muted: #9aa4b2; --line: #3a414c;
      --card: #1d2026; --card-2: #22262e; --accent: #3b82f6; --accent-fg: #ffffff;
      --wave: #60a5fa; --sel: rgba(96,165,250,.22); --sec: #262a32;
      --panel: #22262e; --panel-line: #343a45; --knob-bg: #2b303a; --knob-track: #414857;
      --mod-eq: #60a5fa; --mod-dyn: #f59e0b; --mod-echo: #a855f7; --mod-tool: #2dd4bf;
      --trk-1: #60a5fa; --trk-2: #a78bfa; --trk-3: #38bdf8;
      --trk-4: #fbbf24; --trk-5: #f472b6; --trk-6: #34d399;
      --grid: rgba(255,255,255,.10);
      --accent-soft: rgba(96,165,250,.14);
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px -8px rgba(0,0,0,.55);
      --shadow-lg: 0 18px 36px -18px rgba(0,0,0,.75);
    }
  }
  /* 内嵌进 Gradio 时由父页面主题驱动（见 syncParentTheme） */
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #16181d; --fg: #e6e8eb; --muted: #9aa4b2; --line: #3a414c;
    --card: #1d2026; --card-2: #22262e; --accent: #3b82f6; --accent-fg: #ffffff;
    --wave: #60a5fa; --sel: rgba(96,165,250,.22); --sec: #262a32;
    --panel: #22262e; --panel-line: #343a45; --knob-bg: #2b303a; --knob-track: #414857;
    --mod-eq: #60a5fa; --mod-dyn: #f59e0b; --mod-echo: #a855f7; --mod-tool: #2dd4bf;
    --trk-1: #60a5fa; --trk-2: #a78bfa; --trk-3: #38bdf8;
    --trk-4: #fbbf24; --trk-5: #f472b6; --trk-6: #34d399;
    --grid: rgba(255,255,255,.10);
    --accent-soft: rgba(96,165,250,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px -8px rgba(0,0,0,.55);
    --shadow-lg: 0 18px 36px -18px rgba(0,0,0,.75);
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff; --fg: #1f2328; --muted: #6b7280; --line: #d8dee4;
    --card: #f7f8fa; --card-2: #ffffff; --accent: #3b82f6; --accent-fg: #ffffff;
    --wave: #3b82f6; --sel: rgba(59,130,246,.18); --sec: #eef2f7;
    --danger: #ef4444; --ok: #16a34a;
    --panel: #eef1f5; --panel-line: #dde3ea; --knob-bg: #ffffff; --knob-track: #cfd8e3;
    --mod-eq: #3b82f6; --mod-dyn: #d97706; --mod-echo: #7c3aed; --mod-tool: #0d9488;
    --trk-1: #3b82f6; --trk-2: #8b5cf6; --trk-3: #0ea5e9;
    --trk-4: #f59e0b; --trk-5: #ec4899; --trk-6: #10b981;
    --grid: rgba(16,24,40,.10);
    --accent-soft: rgba(59,130,246,.10);
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 12px -6px rgba(16,24,40,.14);
    --shadow-lg: 0 16px 32px -16px rgba(16,24,40,.30);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: var(--sp-4) var(--sp-4) 48px; background: var(--bg); color: var(--fg);
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* 内嵌模式：收紧内边距，避免与外层 Tab 的留白叠加 */
  html[data-embed="1"] body { padding: var(--sp-2) var(--sp-3) 28px; }
  html[data-embed="1"] h1 { font-size: 15px; }
  html[data-embed="1"] .hint { margin-bottom: var(--sp-2); }
  /* 页头：标题 + 说明，一条分隔线与下方卡片区分层级 */
  .pagehead { margin-bottom: var(--sp-3); }
  h1 { font-size: 18px; font-weight: 650; letter-spacing: .01em; margin: 0 0 4px; }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 0; }
  /* 卡片：外层容器底色，内部控件用 --card-2（更亮）形成层次 */
  .card {
    border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--card);
    padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-3); box-shadow: var(--shadow-sm);
  }
  /* 并排卡片组：素材 / 工程同排，避免两块窄卡片叠出大片空白 */
  .cardgrid {
    display: grid; grid-template-columns: minmax(300px, 1fr) minmax(300px, 1fr);
    gap: var(--sp-3); margin-bottom: var(--sp-3);
  }
  .cardgrid > .card { margin-bottom: 0; }
  @media (max-width: 720px) { .cardgrid { grid-template-columns: 1fr; } }
  .row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
  .row + .row { margin-top: var(--sp-3); }
  label.lb { color: var(--muted); font-size: 12px; min-width: 76px; font-weight: 500; }
  /* —— 表单控件：统一高度与圆角，聚焦时主题色描边 + 光圈 —— */
  select, input[type=text], input[type=number] {
    background: var(--card-2); color: var(--fg); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 0 8px; height: var(--h-ctl); font-size: 12px;
    min-width: 0; font-family: inherit;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  select { max-width: 420px; cursor: pointer; }
  input[type=number] { width: 88px; }
  input[type=text] { background: var(--card-2); }
  select:focus, input[type=text]:focus, input[type=number]:focus {
    outline: none; border-color: var(--accent); box-shadow: var(--ring);
  }
  /* —— 按钮：默认次级（幽灵），.primary 为主操作，.ghost/.danger 为变体 —— */
  button {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    /* 控件底比卡片底略亮一层（color-mix），避免按钮/芯片与所在卡片糊成一片 */
    background: color-mix(in srgb, var(--fg) 8%, var(--card-2));
    color: var(--fg); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 0 12px; height: var(--h-ctl); font-size: 12px;
    font-family: inherit; cursor: pointer; white-space: nowrap;
    transition: background .15s, border-color .15s, box-shadow .15s, filter .15s, transform .1s;
  }
  button:hover { border-color: var(--accent); background: var(--accent-soft); }
  button:active { transform: translateY(.5px); }
  button:focus-visible { outline: none; box-shadow: var(--ring); }
  button.primary {
    background: var(--accent); color: var(--accent-fg); border-color: var(--accent);
    box-shadow: 0 1px 2px rgba(16,24,40,.16);
  }
  button.primary:hover { background: var(--accent); filter: brightness(1.08); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.ghost:hover { color: var(--fg); background: var(--accent-soft); border-color: transparent; }
  button.danger { color: var(--danger); }
  button.danger:hover { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  .msg { font-size: 12px; color: var(--muted); }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--ok); }
  /* 空状态：列表无内容时的占位提示 */
  .empty { color: var(--muted); font-size: 12px; padding: 10px 2px; }
  /* ===== 轨道卡片：左侧轨色条（--trk）+ 头部控制分组 + 波形区 ===== */
  .track {
    position: relative; border: 1px solid var(--line); border-radius: var(--r-md);
    padding: var(--sp-2) var(--sp-3) var(--sp-3) calc(var(--sp-3) + 4px);
    margin-bottom: var(--sp-2); background: var(--card-2); overflow: hidden;
    transition: box-shadow .18s, border-color .18s;
  }
  .track::before {                                 /* 轨色条：标识本轨身份 */
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--trk, var(--accent));
  }
  .track:hover { box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--trk) 45%, var(--line)); }
  .thead { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-2); }
  .tgrp { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
  .tgrp.right { margin-left: auto; }              /* 右侧控制组：靠行尾对齐 */
  .tname { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .tname::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--trk, var(--accent)); }
  .tstate { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sep { width: 1px; height: 18px; background: var(--line); }
  /* 波形区：加共享时间刻度尺，网格线与刻度对齐（见 drawTrack / renderRuler）
     左右内缩量与 .track 的边框+内边距一致，保证刻度尺与下方波形严格对齐 */
  .ruler {
    position: relative; height: 20px;
    margin: 0 calc(var(--sp-3) + 1px) var(--sp-1) calc(var(--sp-3) + 5px);
  }
  .ruler .tk {
    position: absolute; bottom: 0; height: 7px; border-left: 1px solid var(--grid);
  }
  .ruler .tk span {
    position: absolute; left: 3px; bottom: 9px; font-size: 9px; line-height: 1;
    color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .ruler .tk.last span { left: auto; right: 2px; }
  .wave {
    display: block; width: 100%; height: 78px; cursor: crosshair; touch-action: none;
    border-radius: var(--r-sm); background: var(--sec);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  /* 波形外层：承载播放头覆盖层（绝对定位，避免每帧整幅重绘 canvas） */
  .wave-wrap { position: relative; }
  .playhead {
    position: absolute; top: 0; bottom: 0; left: 0; width: 2px; margin-left: -1px;
    background: var(--danger); pointer-events: none; box-shadow: 0 0 6px color-mix(in srgb, var(--danger) 55%, transparent);
  }
  /* —— 增益推子：细轨道 + 主题色填充 + 圆形滑块；数值徽标两侧配 ± 步进按钮 —— */
  .gain {
    -webkit-appearance: none; appearance: none; width: 140px; height: 18px;
    background: transparent; cursor: pointer; margin: 0;
  }
  .gain::-webkit-slider-runnable-track {
    height: 5px; border-radius: 3px; border: 1px solid var(--line); background: var(--sec);
  }
  .gain::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--card-2); border: 2px solid var(--trk, var(--accent)); margin-top: -5.5px;
    box-shadow: var(--shadow-sm); transition: transform .12s;
  }
  .gain:hover::-webkit-slider-thumb { transform: scale(1.1); }
  .gain:focus-visible { outline: none; }
  .gain:focus-visible::-webkit-slider-thumb { box-shadow: var(--ring); }
  .gain::-moz-range-track { height: 5px; border-radius: 3px; background: var(--sec); border: 1px solid var(--line); }
  .gain::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--card-2); border: 2px solid var(--trk, var(--accent)); }
  .gstep { display: inline-flex; align-items: center; gap: 3px; }
  .gain-val {
    font-size: 11px; color: var(--fg); width: 58px; text-align: center;
    font-variant-numeric: tabular-nums;
    background: color-mix(in srgb, var(--fg) 8%, var(--card-2)); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 2px 0;
  }
  .stp {
    width: 22px; height: 22px; padding: 0; font-size: 13px; line-height: 1;
    border-radius: var(--r-sm); color: var(--muted);
    background: color-mix(in srgb, var(--fg) 8%, var(--card-2));
  }
  .stp:hover { color: var(--accent); }
  /* —— 复选框：原生框隐藏，label 变成芯片按钮（选中时主题色高亮） —— */
  .chk {
    font-size: 12px; color: var(--muted); display: inline-flex; align-items: center;
    gap: 4px; cursor: pointer; user-select: none;
  }
  .chk input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
  .chk.pill {
    height: 22px; padding: 0 9px; border-radius: 11px; gap: 0;
    border: 1px solid var(--line); background: color-mix(in srgb, var(--fg) 8%, var(--card-2));
    color: var(--muted);
    font-weight: 600; letter-spacing: .04em; transition: all .15s;
  }
  .chk.pill input[type=checkbox] { display: none; }
  .chk.pill:hover { color: var(--fg); border-color: var(--accent); }
  .chk.pill:has(input:checked) { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .chk.pill.mute:has(input:checked) { background: var(--danger); border-color: var(--danger); }
  /* —— 淡入/淡出：标签 + 等宽数字输入，紧凑成组 —— */
  .fades { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; }
  .fades input { width: 62px; height: 22px; padding: 0 6px; font-size: 11px; text-align: center; }
  .tbtn { height: 22px; padding: 0 9px; font-size: 11px; }
  audio { height: 30px; vertical-align: middle; }
  .mixitem {
    display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; padding: 9px 0;
    border-top: 1px solid var(--line);
  }
  .mixitem:first-child { border-top: none; }
  .mixname { min-width: 200px; font-size: 12px; font-weight: 500; }
  a.dl { font-size: 12px; color: var(--accent); text-decoration: none; }
  a.dl:hover { text-decoration: underline; }
  /* 单轨试听按钮：仅显示 ▶/⏸ 符号，紧凑排版 */
  button.pl { padding: 0 10px; height: 24px; font-size: 12px; line-height: 1; }
  /* 自定义滚动条（内容区超长时与主题一致） */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--knob-track); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); background-clip: padding-box; }
  /* 统一 transport 工具条：左侧「播放/停止/循环」控制簇，中部时钟读数，右侧状态消息 */
  .transport {
    border: 1px solid var(--line); border-radius: var(--r-md); background: var(--card-2);
    padding: var(--sp-2) var(--sp-3); gap: var(--sp-3); margin-top: var(--sp-1);
    box-shadow: var(--shadow-sm);
  }
  .transport label.lb { min-width: auto; }
  /* 控制簇：三件套共用相邻边框（负间距合并），仅两端圆角，形似硬件运输键 */
  .tp-grp { display: inline-flex; align-items: center; }
  .tp-grp > * { height: 26px; }
  .tp-grp > * + * { margin-left: -1px; }
  .tp-grp > button, .tp-grp > .chk.pill { border-radius: 0; }
  .tp-grp > :first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); }
  .tp-grp > :last-child { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
  .tp-grp > #tp-play { width: 40px; font-size: 14px; }
  .tp-grp > #tp-stop { width: 40px; font-size: 12px; }
  .tp-grp > .chk.pill { padding: 0 11px; }
  /* 时钟读数：当前位置大写强调 + 「/」分隔 + 总时长弱化，等宽数字避免跳动 */
  .tp-clock {
    display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--sec);
    font-size: 13px; font-weight: 600; color: var(--fg);
    font-variant-numeric: tabular-nums;
  }
  .tp-clock .tp-sep { color: var(--muted); font-weight: 400; }
  .tp-clock #tp-dur { font-size: 12px; font-weight: 500; color: var(--muted); }
  /* 播放中：当前时间码转主题色，一眼看出走带状态 */
  .transport.on .tp-clock #tp-time { color: var(--accent); }
  .tp-msg { margin-left: auto; }
  /* 选区读数：起始时间码 + 选区时长（等宽数字，避免数值变化时抖动） */
  .selinfo { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  /* ===== FX 面板（专业效果器风）：模块分组框 + 彩色标题 + 旋钮 + 垂直推子 =====
     设计参照硬件/插件惯例：左侧模块色圆点 + 同色标题，旋钮盘面带行程弧·值弧·刻度·指针，
     双极参数的值弧从中性点向两侧生长；推子为纵向轨道 + 模块色填充。
     每个控件为「盘面 → 标签 → 数值徽标」三段。
     排版约定：三个模块等高（面板 align-items:stretch），每个模块内部「可视化区 + 控件区」
     统一为 --fx-h 高（EQ 曲线 / GR 表 / 推子轨道 / 旋钮列都吃同一高度），因此各模块的
     顶端、底端与数值徽标基线完全对齐；控件区不足则垂直居中兜底。 */
  .fxpanel {
    /* --fx-h：模块内「可视化区 + 控件区」的统一高度，三个模块都吃这个高度以保证上下沿对齐 */
    --fx-h: 122px;
    /* --fxmod-w：音质与压缩模块的固定同宽（以音质「曲线 176 + 间隙 8 + 三旋钮 156 + 内边距」的实测宽度为准） */
    --fxmod-w: 362px;
    display: flex; align-items: stretch; gap: var(--sp-2); flex-wrap: wrap; margin: 0 0 var(--sp-2) 12px;
  }
  .fxmod {
    display: flex; flex-direction: column; padding: 7px 10px 8px;
    border: 1px solid var(--panel-line); border-radius: var(--r-md); background: var(--panel);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
  }
  .fxmod[data-mod="eq"] { --mod: var(--mod-eq); }
  .fxmod[data-mod="dyn"] { --mod: var(--mod-dyn); }
  .fxmod[data-mod="echo"] { --mod: var(--mod-echo); }
  .fxmod[data-mod="tool"] { --mod: var(--mod-tool); }
  /* 音质 = 压缩 固定同宽：压缩内容（GR 表 + 两旋钮）水平居中，两块左右边框严格对齐 */
  .fxmod[data-mod="eq"], .fxmod[data-mod="dyn"] { width: var(--fxmod-w); }
  .fxmod[data-mod="dyn"] .fxmod-b { align-items: center; }
  /* FX 工具模块：独占一整行（flex-basis 100% 强制换行并铺满），内部三组控件横向均布。
     做成"工具栏"而非窄卡：音质/压缩/回声那一行只剩 ~66px（压缩加宽到与音质同宽后），
     塞不下窄卡；若竖排三行会把面板撑到 283px，横向一行只需 ~222px。 */
  .fxmod[data-mod="tool"] { flex: 1 1 100%; }
  .fxmod[data-mod="tool"] .fxmod-b { flex-direction: row; align-items: center; justify-content: space-between; gap: 18px; }
  .fxmod[data-mod="tool"] .ftrow + .ftrow { margin-top: 0; }   /* 横向排列时清掉竖排用的行距 */
  /* 旁通：只压暗「受影响的处理模块」，FX 工具模块本身保持全亮（要能点回来） */
  .fxpanel.fx-off .fxmod:not([data-mod="tool"]), .fxpanel.fx-off .fxmeter { opacity: .42; }
  /* 模块标题条：左侧色点 + 着色标题 + 底部分隔线（固定高度，不参与拉伸） */
  .fxmod-h {
    flex: none; display: flex; align-items: center; gap: 5px; margin-bottom: 6px; padding-bottom: 4px;
    border-bottom: 1px solid var(--panel-line);
    font-size: 10.5px; line-height: 1; font-weight: 600; letter-spacing: .06em; color: var(--mod);
  }
  .fxmod-h::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--mod);
    box-shadow: 0 0 6px color-mix(in srgb, var(--mod) 70%, transparent);
  }
  .fxmod-h .fxmod-t { flex: 1 1 auto; }
  /* 「归零」小按钮：平时低调，hover 才用模块色强调（音质 / 压缩各一个） */
  .fxmod-r {
    flex: none; margin-left: 6px; padding: 0 6px; height: 16px; line-height: 14px;
    border: 1px solid var(--panel-line); border-radius: 4px; background: transparent;
    color: var(--muted); font-size: 9.5px; letter-spacing: .04em; cursor: pointer;
    transition: color .12s, border-color .12s, background .12s;
  }
  .fxmod-r:hover { color: var(--mod); border-color: var(--mod); background: color-mix(in srgb, var(--mod) 14%, transparent); }
  /* —— FX 工具模块（旁通 / 预设 / 复制到其他轨）：三行紧凑控件 —— */
  .ftrow { display: flex; align-items: center; gap: 6px; }
  .ftrow + .ftrow { margin-top: 5px; }
  .ftrow > .ftlbl { flex: none; min-width: 30px; font-size: 10px; color: var(--muted); white-space: nowrap; }
  .ftsel {
    flex: 1 1 auto; min-width: 0; height: 21px; padding: 0 4px; border-radius: 4px;
    border: 1px solid var(--panel-line); background: var(--knob-bg); color: var(--fg); font-size: 10.5px;
  }
  .ftbtn {
    flex: none; height: 21px; padding: 0 8px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--panel-line); background: var(--sec); color: var(--fg);
    font-size: 10.5px; white-space: nowrap;
    transition: color .12s, border-color .12s, background .12s;
  }
  .ftbtn:hover { color: var(--mod); border-color: var(--mod); }
  .ftbtn.on { color: var(--mod); border-color: var(--mod); background: color-mix(in srgb, var(--mod) 16%, transparent); }
  .ftrow > .ftbtn.wfull { flex: 1 1 auto; }        /* 旁通行：按钮吃掉标签外的剩余宽度 */
  /* 模块内容区：吃掉剩余高度，内容不足时垂直居中（保证与兄弟模块上下沿对齐） */
  .fxmod-b { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
  .knobrow { display: flex; align-items: flex-start; gap: 6px; }
  /* —— 旋钮：SVG 盘面（行程弧 + 值弧 + 刻度 + 指针）+ 标签 + 可编辑数值徽标 ——
     旋钮列总高 = 盘面 32 + 间隙 2 + 标签 11 + 间隙 2 + 徽标 13 = 60，两行（+行距 2）= 122 = --fx-h */
  .kb { width: 48px; display: flex; flex-direction: column; align-items: center; gap: 2px; outline: none; }
  .kb-d {
    position: relative; width: 32px; height: 32px; cursor: ns-resize; touch-action: none;
    border-radius: 50%; filter: drop-shadow(0 1px 1px rgba(16,24,40,.18));
  }
  .kb-d svg { display: block; width: 32px; height: 32px; }
  .kb-ring { fill: url(#kbFill); stroke: var(--panel-line); stroke-width: 1; }
  .kb-track { fill: none; stroke: var(--knob-track); stroke-width: 2.5; stroke-linecap: round; opacity: .9; }
  .kb-tk { stroke: var(--muted); stroke-width: 1; opacity: .55; }
  .kb-arc { fill: none; stroke: var(--mod); stroke-width: 3.5; stroke-linecap: round; }
  .kb-ptr { stroke: var(--fg); stroke-width: 2.2; stroke-linecap: round; }
  .kb-cap { fill: var(--fg); opacity: .85; }
  .kb:focus-visible .kb-d, .kb:focus-visible .fd-t { box-shadow: var(--ring); }
  .kb-l, .fd-l { height: 11px; font-size: 10px; line-height: 11px; color: var(--muted); white-space: nowrap; }
  /* 数值徽标：常态为只读文本，双击原地换成输入框（固定高度，保证各模块徽标基线齐平） */
  .kb-v, .fd-v {
    width: 100%; height: 13px; padding: 0; border-radius: 3px; text-align: center; cursor: text;
    font-size: 11px; line-height: 13px; color: var(--fg); font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden;
  }
  .kb-v:hover, .fd-v:hover { background: var(--sec); box-shadow: inset 0 0 0 1px var(--panel-line); }
  .fxnum {
    width: 100%; height: 13px; padding: 0; border: none; border-radius: 3px; background: var(--knob-bg);
    text-align: center; font-size: 11px; line-height: 13px; color: var(--fg);
    font-variant-numeric: tabular-nums; outline: none;
    box-shadow: inset 0 0 0 1px var(--mod);
    -moz-appearance: textfield; appearance: textfield;
  }
  .fxnum::-webkit-outer-spin-button, .fxnum::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  /* —— 垂直推子：纵向轨道 + 模块色填充 + 带纹理的滑块（拖拽/点击跳转） ——
     推子列总高 = 轨道 (--fx-h - 28) + 间隙 2 + 标签 11 + 间隙 2 + 徽标 13 = --fx-h */
  .faderrow { display: flex; align-items: flex-start; gap: 8px; }
  .fd { width: 48px; display: flex; flex-direction: column; align-items: center; gap: 2px; outline: none; }
  .fd-t {
    position: relative; width: 8px; height: calc(var(--fx-h) - 28px); border-radius: 4px;
    background: var(--knob-track); cursor: ns-resize; touch-action: none;
    box-shadow: inset 0 0 0 1px var(--panel-line);
  }
  .fd-f { position: absolute; left: 0; right: 0; bottom: 0; height: 0; border-radius: 4px; background: var(--mod); }
  /* 滑块按「轨道高 - 滑块高」定位（--pos 由 JS 写入 0..1），两端都不越出轨道，不会压住下方标签 */
  .fd-k {
    --kd: 12px;
    position: absolute; left: -5px; right: -5px; height: var(--kd);
    top: calc((1 - var(--pos, 1)) * (100% - var(--kd)));
    border-radius: 3px;
    background: linear-gradient(var(--fg), color-mix(in srgb, var(--fg) 82%, #000));
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .fd-k::after {                          /* 滑块中部手柄线，提升质感 */
    content: ""; position: absolute; left: 3px; right: 3px; top: 50%; height: 1px;
    margin-top: -.5px; background: var(--bg); opacity: .55;
  }
  /* —— 电平表（IN/OUT）与 GR 表 ——
     列底即为「填充色」（电平为绿→黄→红渐变、GR 为 danger 红），用自上而下的遮罩盖住未点亮部分，
     这样渐变的色标固定在整列上，不会随电平高低被拉伸；
     GR 表填充自上而下（压缩越深越长），故遮罩改为从底部往上盖。 */
  .fxmeter {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    align-self: stretch; min-height: 0; padding: 7px 6px;
    border: 1px solid var(--panel-line); border-radius: var(--r-md); background: var(--panel);
  }
  .mt-bars { display: flex; gap: 2px; flex: 1; min-height: 0; position: relative; }
  .mt-col { position: relative; width: 11px; border-radius: 2px; background: var(--knob-track); overflow: hidden; }
  .mt-col.lv { background: linear-gradient(to top, #22c55e 0%, #22c55e 52%, #eab308 76%, #ef4444 94%); }
  .mt-col.gr { background: linear-gradient(to bottom, #f59e0b 0%, var(--danger) 70%); }
  .mt-mask { position: absolute; left: 0; right: 0; top: 0; height: 100%; background: var(--knob-track); }
  .mt-mask.bot { top: auto; bottom: 0; }
  .mt-peak { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--fg); opacity: .8; }
  .mt-lab { height: 11px; font-size: 9.5px; line-height: 11px; letter-spacing: .04em; color: var(--muted); }
  /* 电平刻度：贴在表条上方的参考线（-6/-12/-24/-48 dBFS），不再需要读数字即可判断量级 */
  .mt-tick {
    position: absolute; left: 0; right: 0; height: 1px; background: var(--panel-line);
    z-index: 2; pointer-events: none;
  }
  /* 压缩模块内的 GR 表：整列吃满 --fx-h（= 列高 + 间隙 + 「GR」标签），与左侧 EQ 曲线同高 */
  .mt-gr { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 20px; }
  .mt-gr .mt-col { height: calc(var(--fx-h) - 13px); flex: none; }
  /* —— 「可视化 + 控件」并排：音质模块（左 EQ 频响曲线 / 右 6 旋钮两行）、压缩模块（左 GR 表 / 右 2 旋钮两行） —— */
  .fxside { display: flex; align-items: center; gap: 8px; }
  .fxknobs { display: flex; flex-direction: column; gap: 2px; }
  /* 边框用 inset 阴影而非 border：保证画布内容区尺寸与 JS 的 EQ_W/EQ_H 严格一致，曲线不被缩放 */
  .eqc {
    display: block; width: 176px; height: var(--fx-h); flex: none;
    border: 0; border-radius: var(--r-sm); background: var(--knob-bg); cursor: ns-resize; touch-action: none;
    box-shadow: inset 0 0 0 1px var(--panel-line);
  }
  .eqc:focus-visible { box-shadow: var(--ring), inset 0 0 0 1px var(--panel-line); }
  /* —— 母带行：参数成组，渲染按钮与状态同排 —— */
  .master { gap: var(--sp-3); }
  .master .mg { display: inline-flex; align-items: center; gap: 5px; }
  .master .mg input[type=number] { width: 76px; }
  .master .mg input[type=text] { width: 180px; }
</style>
</head>
<body>
  <!-- 旋钮盘面的径向渐变（供全部旋钮引用，集中定义避免重复 id） -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <radialGradient id="kbFill" cx="35%" cy="28%" r="78%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"></stop>
        <stop offset="55%" stop-color="#ffffff" stop-opacity=".18"></stop>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
      </radialGradient>
    </defs>
  </svg>

  <header class="pagehead">
    <h1 id="t-title"></h1>
    <p class="hint" id="t-hint"></p>
  </header>

  <!-- 素材与工程同排：两块窄卡片并排，避免纵向叠出大片空白 -->
  <div class="cardgrid">
    <section class="card">
      <div class="row">
        <label class="lb" id="t-src"></label>
        <select id="source"></select>
        <button id="load" class="primary"></button>
        <button id="refresh" class="ghost"></button>
        <span id="msg" class="msg"></span>
      </div>
    </section>

    <!-- 工程持久化：保存当前编辑状态 / 载入已保存工程（可脱离素材下拉单独使用） -->
    <section class="card">
      <div class="row">
        <label class="lb" id="t-prj"></label>
        <select id="project"></select>
        <button id="save-proj"></button>
        <button id="open-proj"></button>
        <span id="prj-msg" class="msg"></span>
      </div>
    </section>
  </div>

  <section class="card" id="editor" hidden>
    <div class="row">
      <label class="lb" id="t-sel"></label>
      <input id="sel-start" type="number" step="0.01" min="0" value="0">
      <span class="msg">–</span>
      <input id="sel-end" type="number" step="0.01" min="0" value="0">
      <span class="sep"></span>
      <button id="apply-all"></button>
      <button id="reset-all"></button>
      <button id="sel-clear" class="ghost"></button>
      <span id="sel-info" class="selinfo"></span>
    </div>
    <!-- 共享时间刻度尺：所有轨共用同一时间轴，刻度与波形网格线对齐 -->
    <div class="ruler" id="ruler"></div>
    <div id="tracks"></div>
    <!-- 统一 transport：播放/停止/循环为一个控制簇，所有轨共用同一时钟（标准 DAW 逻辑） -->
    <div class="row transport" id="transport">
      <label class="lb" id="t-transport"></label>
      <span class="tp-grp">
        <button id="tp-play" class="pl primary"></button>
        <button id="tp-stop" class="pl"></button>
        <label class="chk pill"><input id="tp-loop" type="checkbox" checked><span id="t-loop"></span></label>
      </span>
      <span class="tp-clock">
        <span id="tp-time">0:00.0</span><span class="tp-sep">/</span><span id="tp-dur">0:00.0</span>
      </span>
      <span id="tp-msg" class="msg tp-msg"></span>
    </div>
    <div class="row master">
      <label class="lb" id="t-master"></label>
      <span class="mg"><label class="msg" id="t-loud"></label>
        <input id="loud" type="number" step="0.5" min="-30" max="-5" value="-14"></span>
      <span class="mg"><label class="msg" id="t-tp"></label>
        <input id="tp" type="number" step="0.1" min="-6" max="-0.1" value="-1.5"></span>
      <span class="mg"><label class="msg" id="t-proj"></label>
        <input id="proj" type="text"></span>

  <section class="card">

  <!-- 单轨试听：隐藏的共享播放器（配合每轨 ▶ 按钮，见 previewTrack） -->
  <audio id="solo-audio" hidden></audio>

<script>
"use strict";
/* ==================================================================== 状态 */
const S = {
  T: {},            // 后端下发的文案表
  sources: [],      // 可分轨素材（分离记录）
  projects: [],     // 已保存工程清单
  tracks: [],       // 当前载入的轨道
  dur: 0,           // 全局时长（秒）
  ticks: [],        // 时间刻度（秒）：刻度尺与各轨波形网格线共用同一组刻度
  rootTaskId: "",   // 素材所属分离任务 id（写入工程 derived_from）
  sel: [0, 0],      // 全局选区 [起, 止]
  taskId: null,     // 当前渲染任务 id
  timer: null,      // 轮询定时器
  embed: new URLSearchParams(location.search).get("embed") === "1",  // 是否内嵌在 Gradio Tab
  // —— 统一播放（transport）状态 ——
  ctx: null, master: null,   // AudioContext / 总输出增益
  bufs: {},                  // path → AudioBuffer 缓存（首次播放解码）
  nodes: [],                 // 当前已调度的 AudioBufferSourceNode
  playing: false,            // 是否正在播放
  loop: true,                // 是否循环播放（默认循环，与 transport 复选框初值一致）
  pos: 0,                    // 播放头位置（时间轴秒）
  t0: 0,                     // 本轮播放的在音频时钟上的起点
  playStart: 0, playEnd: 0,  // 本轮播放的时间轴区间
  nextLoopAt: 0,             // 循环模式下下一轮的在音频时钟起点（lookahead 预调度）
  raf: 0,                    // requestAnimationFrame 句柄
  gen: 0,                    // 播放代次：重排后旧动画帧回调据此自我作废，避免双循环
};
const $ = (id) => document.getElementById(id);
const T = (key) => (S.T && S.T[key]) || key;
const enc = encodeURIComponent;
const r3 = (v) => Math.round(v * 1000) / 1000;
const baseName = (p) => String(p || "").split(/[\\/]/).pop() || "";

/* ==================================================================== 工具 */
function setMsg(text, cls) {
  const el = $("msg");
  el.textContent = text || "";
  el.className = "msg" + (cls ? " " + cls : "");
}
function setStatus(text, cls) {
  const el = $("status");
  el.textContent = text || "";
  el.className = "msg" + (cls ? " " + cls : "");
}
function setPrjMsg(text, cls) {
  const el = $("prj-msg");
  el.textContent = text || "";
  el.className = "msg" + (cls ? " " + cls : "");
}
async function getJSON(url) {
  const resp = await fetch(url);
  const data = await resp.json().catch(() => ({ ok: false, error: "invalid json" }));
  if (!data || data.ok === undefined) return { ok: false, error: "invalid response" };
  return data;
}
async function postJSON(url, body) {
  const resp = await fetch(url, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  const data = await resp.json().catch(() => ({ ok: false, error: "invalid json" }));
  if (!data || data.ok === undefined) return { ok: false, error: "invalid response" };
  return data;
}

/* ==================================================================== 文案 */
function applyTexts() {
  document.title = T("多轨编辑器");
  $("t-title").textContent = T("多轨编辑器");
  $("t-hint").textContent = T("在波形上拖拽选择区间");
  $("t-src").textContent = T("选择分离素材");
  $("load").textContent = T("载入");
  $("refresh").textContent = T("刷新");
  $("t-sel").textContent = T("全局选区");
  $("apply-all").textContent = T("应用选区到全部轨");
  $("reset-all").textContent = T("恢复全部整轨");
  $("sel-clear").textContent = T("取消选择区");
  $("t-transport").textContent = T("播放控制");
  $("t-master").textContent = T("母带");
  $("t-loud").textContent = T("响度目标(LUFS)");
  $("t-tp").textContent = T("真峰值(dBTP)");
  $("t-proj").textContent = T("项目名(可选)");
  $("render").textContent = T("渲染成品");
  $("cancel").textContent = T("取消渲染");
  $("t-preview").textContent = T("试听");
  $("t-mixes").textContent = T("混音记录");
  $("refresh-mixes").textContent = T("刷新");
  $("t-prj").textContent = T("工程");
  $("save-proj").textContent = T("保存工程");

/* ==================================================================== 素材清单 */
async function loadSources(keepSelection) {
  const data = await getJSON("/api/mix/sources");
  if (!data.ok) { setMsg(data.error || "load failed", "err"); return; }
  S.T = data.strings || {};
  S.sources = data.sources || [];
  applyTexts();

  const sel = $("source");
  const prev = keepSelection ? sel.value : "";
  sel.textContent = "";
  if (!S.sources.length) {
    setMsg(T("无可用素材，请先执行一次音轨分离"), "err");
  } else {
    S.sources.forEach((src, i) => {
      const opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = src.name;
      sel.appendChild(opt);
    });
    setMsg("");
  }
  if (prev && S.sources[prev]) sel.value = prev;
  renderMixList(data.mixes || []);
}

/* ==================================================================== 波形绘制 */
function drawTrack(t) {
  const cv = t.canvas;
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(120, cv.clientWidth || 600);
  const h = 78;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  // 颜色一律取 CSS 变量：轨色 / 网格 / 选区随明暗主题与轨序自动切换
  const cs = getComputedStyle(cv);
  const cvar = (name, fb) => cs.getPropertyValue(name).trim() || fb;
  const line = cvar("--line", "#d8dee4"), grid = cvar("--grid", "rgba(0,0,0,.1)");
  const trk = cvar("--trk", cvar("--wave", "#3b82f6"));
  ctx.fillStyle = cvar("--sec", "#eef2f7");
  ctx.fillRect(0, 0, w, h);
  // 时间网格：与顶部刻度尺同一组刻度（S.ticks），便于横向读数
  if (S.dur > 0 && S.ticks.length) {
    ctx.strokeStyle = grid; ctx.lineWidth = 1; ctx.beginPath();
    S.ticks.forEach((sec) => {
      const x = Math.round((sec / S.dur) * w) + .5;
      ctx.moveTo(x, 0); ctx.lineTo(x, h);
    });
    ctx.stroke();
  }
  ctx.strokeStyle = line;
  ctx.beginPath(); ctx.moveTo(0, h / 2 + .5); ctx.lineTo(w, h / 2 + .5); ctx.stroke();

  // 包络：peaks[i] = [min,max]（-1..1）
  const mid = h / 2, amp = (h - 10) / 2;
  const n = t.peaks.length;
  const px = (i) => (n > 1 ? (i / (n - 1)) * w : 0);
  if (n > 1) {
    // 先铺一层淡淡的包络填充，波形更饱满（纯线条在大屏上偏空）
    ctx.beginPath();
    for (let i = 0; i < n; i++) ctx.lineTo(px(i), mid - t.peaks[i][1] * amp);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(px(i), mid - t.peaks[i][0] * amp);
    ctx.closePath();
    ctx.save(); ctx.globalAlpha = .16; ctx.fillStyle = trk; ctx.fill(); ctx.restore();
  }
  ctx.strokeStyle = trk; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const x = px(i), mn = t.peaks[i][0], mx = t.peaks[i][1];
    ctx.moveTo(x, mid - mx * amp);
    ctx.lineTo(x, mid - mn * amp);
  }
  ctx.stroke();

  if (S.dur <= 0) return;
  // 裁剪后区间外压暗，直观反映该轨实际参与渲染的部分
  if (t.clips.length) {
    const c = t.clips[0];
    const xs = (c.in / S.dur) * w, xe = (c.out / S.dur) * w;
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillRect(0, 0, Math.max(0, xs), h);
    ctx.fillRect(Math.min(w, xe), 0, Math.max(0, w - xe), h);
  }
  // 全局选区
  if (S.sel[1] > S.sel[0]) {
    const xs = (S.sel[0] / S.dur) * w, xe = (S.sel[1] / S.dur) * w;
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--sel");
    ctx.fillRect(xs, 0, Math.max(1, xe - xs), h);
    ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue("--wave");
    ctx.beginPath(); ctx.moveTo(xs, 0); ctx.lineTo(xs, h);
    ctx.moveTo(xe, 0); ctx.lineTo(xe, h); ctx.stroke();
  }
}
/* 刻度尺跨度选择：从候选档位里取「刻度数 ≤ 12」的最小档，保证任何时长都不过密 */
function rulerStep(dur) {
  const steps = [0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600];
  for (const s of steps) if (dur / s <= 12) return s;
  return 900;
}
/* 秒 → m:ss（刻度尺与播放头共用，短于 1 分钟也补前导 0 分，列对齐更好读） */
function fmtClock(sec) {
  const s = Math.max(0, sec);
  const m = Math.floor(s / 60);
  return m + ":" + String(Math.floor(s - m * 60)).padStart(2, "0");
}
/* 渲染顶部共享刻度尺：生成 .tk 元素并按百分比定位，同时把刻度秒数组写回 S.ticks */
function renderRuler() {
  const box = $("ruler");
  if (!box) return;
  box.textContent = "";
  S.ticks = [];
  const dur = S.dur;
  if (!(dur > 0)) return;
  const step = rulerStep(dur);
  for (let sec = 0; sec <= dur + 1e-6; sec += step) {
    const tk = document.createElement("div");
    tk.className = "tk";
    tk.style.left = ((sec / dur) * 100).toFixed(4) + "%";
    const lb = document.createElement("span");
    lb.textContent = fmtClock(sec);
    tk.appendChild(lb);
    // 最后一个刻度若离右端过近，标签改为右对齐，避免溢出容器
    if (dur - sec < step * 0.5) tk.classList.add("last");
    box.appendChild(tk);
    S.ticks.push(r3(sec));
  }
}
function redrawAll() {
  // 波形与 EQ 曲线颜色均取自 CSS 变量，主题变化后需一并重绘
  S.tracks.forEach((t) => { drawTrack(t); drawEqCurve(t); });
  updateSelInfo();
}

/* 选区读数：起始时间码 + 选区总时长；无有效选区时显示整曲范围（与播放区间一致） */
function updateSelInfo() {
  const el = $("sel-info");
  if (!el) return;
  const [a, b] = playRange();
  el.textContent = T("起始") + " " + fmtTime(a) + "  " + T("时长") + " " + fmtTime(Math.max(0, b - a));
}

function updateTrackState(t) {
  if (!t.stateEl) return;
  if (t.clips.length) {
    const c = t.clips[0];
    t.stateEl.textContent = `[${r3(c.in)}s ~ ${r3(c.out)}s]`;
  } else {
    t.stateEl.textContent = "";
  }
}

/* ==================================================================== 轨道区 */
/* items: [{type, label, path, name}]，来自素材记录或已保存工程 */
function buildTracks(items) {
  const box = $("tracks");
  stopPlayback();            // 重建轨道前先停掉统一播放并复位播放头

    const wrap = document.createElement("div");

    gName.className = "tgrp";
    const name = document.createElement("span");
    name.className = "tname";
    name.textContent = item.label || item.name;
    gName.appendChild(name);

    // 单轨试听：▶ 按钮，共享 #solo-audio 播放本轨原文件（本地套用该轨增益）
    const playBtn = document.createElement("button");
    playBtn.className = "pl";
    playBtn.textContent = "▶";
    playBtn.title = T("试听本轨");
    playBtn.dataset.path = enc(item.path);   // 用于判定"当前播放的是哪一轨"
    playBtn.addEventListener("click", () => previewTrack(track));
    gName.appendChild(playBtn);
    head.appendChild(gName);

    // 右组：M/S 芯片 + 增益推子（带 ± 步进）+ 淡入淡出 + 裁切按钮 + 状态
    const gCtl = document.createElement("span");
    gCtl.className = "tgrp right";

    const muteLab = document.createElement("label"); muteLab.className = "chk pill mute";
    muteLab.title = T("静音");
    const mute = document.createElement("input"); mute.type = "checkbox";
    muteLab.appendChild(mute); muteLab.appendChild(document.createTextNode("M"));
    gCtl.appendChild(muteLab);

    const soloLab = document.createElement("label"); soloLab.className = "chk pill";
    soloLab.title = T("独奏");
    const solo = document.createElement("input"); solo.type = "checkbox";
    soloLab.appendChild(solo); soloLab.appendChild(document.createTextNode("S"));
    gCtl.appendChild(soloLab);

    const gain = document.createElement("input");
    gain.type = "range"; gain.min = "-30"; gain.max = "12"; gain.step = "0.5"; gain.value = "0";
    gain.className = "gain";
    gCtl.appendChild(gain);
    // 数值徽标两侧配 ± 步进按钮（数值参数统一支持步进微调）
    const gainBox = document.createElement("span");
    gainBox.className = "gstep";
    const gDown = document.createElement("button");
    gDown.className = "stp"; gDown.textContent = "−";
    const gUp = document.createElement("button");
    gUp.className = "stp"; gUp.textContent = "+";
    const gainVal = document.createElement("span");
    gainVal.className = "gain-val"; gainVal.textContent = "0.0 dB";
    gainBox.append(gDown, gainVal, gUp);
    gCtl.appendChild(gainBox);

    const fades = document.createElement("span");
    fades.className = "fades";
    const fin = document.createElement("input"); fin.type = "number"; fin.min = "0"; fin.step = "0.1"; fin.value = "0";
    const fout = document.createElement("input"); fout.type = "number"; fout.min = "0"; fout.step = "0.1"; fout.value = "0";
    const finLab = document.createElement("span"); finLab.textContent = T("淡入(秒)");
    const foutLab = document.createElement("span"); foutLab.textContent = T("淡出(秒)");
    fades.append(finLab, fin, foutLab, fout);
    gCtl.appendChild(fades);

    const trimBtn = document.createElement("button");
    trimBtn.className = "tbtn"; trimBtn.textContent = T("裁为选区");
    gCtl.appendChild(trimBtn);
    const resetBtn = document.createElement("button");
    resetBtn.className = "tbtn ghost"; resetBtn.textContent = T("恢复整轨");
    gCtl.appendChild(resetBtn);

    const stateEl = document.createElement("span");
    stateEl.className = "tstate";
    gCtl.appendChild(stateEl);
    head.appendChild(gCtl);

    // ---- FX 面板：音质（声像 / 三段 EQ / 高通 / 低通）+ 压缩 + 回声 ----
    // 参照专业效果器惯例：连续比例量用旋钮，时间·强度类用垂直推子。
    // 控件值实时写回 track 并驱动节点链，保证「听到什么就导出什么」。
    const fxPanel = document.createElement("div");
    fxPanel.className = "fxpanel";
    // mkMod：建一个模块分组框（色点 + 标题 + 可选「归零」按钮），返回内容区 DOM。
    // resets 为空数组时无按钮；传入的数组在控件建好后 push 复位函数（点击时实时读取）。
    const mkMod = (key, titleKey, resets) => {
      const mod = document.createElement("section");
      mod.className = "fxmod"; mod.dataset.mod = key;
      const h = document.createElement("div");
      h.className = "fxmod-h";
      const title = document.createElement("span");
      title.className = "fxmod-t"; title.textContent = T(titleKey);
      h.appendChild(title);
      if (resets) {
        const rb = document.createElement("button");
        rb.type = "button"; rb.className = "fxmod-r";
        rb.textContent = T("归零"); rb.title = T("全部复位到中性值");
        rb.addEventListener("click", () => resets.forEach((fn) => fn()));
        h.appendChild(rb);
      }
      const b = document.createElement("div");
      b.className = "fxmod-b";
      mod.append(h, b);
      fxPanel.appendChild(mod);
      return b;
    };
    const eqResets = [], dynResets = [], echoResets = [];  // 音质 / 压缩 / 回声的「归零」目标（建控件后填充）
    const mkRow = (body, cls) => {
      const r = document.createElement("div");
      r.className = cls; body.appendChild(r);
      return r;
    };
    // 音质模块：左侧 EQ 频响曲线（可拖手柄），右侧两行旋钮（上行三段 EQ，下行滤波与声像）
    const eqWrap = document.createElement("div"); eqWrap.className = "fxside";
    const eqCv = document.createElement("canvas"); eqCv.className = "eqc";
    const eqKnobs = document.createElement("div"); eqKnobs.className = "fxknobs";
    const eqRowA = mkRow(eqKnobs, "knobrow");
    const eqRowB = mkRow(eqKnobs, "knobrow");
    eqWrap.append(eqCv, eqKnobs);
    mkMod("eq", "音质", eqResets).appendChild(eqWrap);
    // 压缩模块：左侧 GR 表（自上而下填充，压缩越深越长），右侧阈值/比率两个旋钮
    // 旋钮竖排（而非横排）以吃满 --fx-h，保证与音质/回声模块上下沿对齐
    const dynWrap = document.createElement("div"); dynWrap.className = "fxside";
    const grWrap = document.createElement("div"); grWrap.className = "mt-gr";
    const grCol = mkMtrCol("gr", false);
    const grLab = document.createElement("div"); grLab.className = "mt-lab"; grLab.textContent = T("GR");
    grWrap.append(grCol.col, grLab);
    const dynKnobs = document.createElement("div"); dynKnobs.className = "fxknobs";
    dynWrap.append(grWrap, dynKnobs);
    mkMod("dyn", "压缩", dynResets).appendChild(dynWrap);
    const echoRow = mkRow(mkMod("echo", "回声", echoResets), "faderrow");

    // 控件区间与后端钳制区间一致；中性值 = 双击盘面 / Home 的复位目标
    const panEl = mkFxCtl({ label: "声像", tip: "声像", kind: "pan", bipolar: true,
      min: -1, max: 1, step: 0.05, init: 0,
      onChange: (v) => { track.pan = v; applyTrackFx(track); } });
    const eqLowEl = mkFxCtl({ label: "低频", tip: "低频架 200Hz", kind: "db", bipolar: true,
      min: -15, max: 15, step: 0.5, init: 0,
      onChange: (v) => { track.eqLow = v; applyTrackFx(track); drawEqCurve(track); } });
    const eqMidEl = mkFxCtl({ label: "中频", tip: "中频峰 1kHz", kind: "db", bipolar: true,
      min: -15, max: 15, step: 0.5, init: 0,
      onChange: (v) => { track.eqMid = v; applyTrackFx(track); drawEqCurve(track); } });
    const eqHighEl = mkFxCtl({ label: "高频", tip: "高频架 4kHz", kind: "db", bipolar: true,
      min: -15, max: 15, step: 0.5, init: 0,
      onChange: (v) => { track.eqHigh = v; applyTrackFx(track); drawEqCurve(track); } });
    const hpfEl = mkFxCtl({ label: "高通", tip: "高通（0 = 关闭）", kind: "hz",
      min: 0, max: 2000, step: 10, init: 0,
      onChange: (v) => { track.hpf = v; applyTrackFx(track); drawEqCurve(track); } });
    const lpfEl = mkFxCtl({ label: "低通", tip: "低通（0 = 关闭）", kind: "hz",
      min: 0, max: 20000, step: 100, init: 0,
      onChange: (v) => { track.lpf = v; applyTrackFx(track); drawEqCurve(track); } });
    // 压缩：阈值 0dB（顶到上限）或比率 1 即等同关闭（与后端 _comp_filter 判据一致）
    // 阈值的中性点在行程最右端，故用 bipolar 让值弧从「关闭」端向做深压缩的方向生长
    const compThEl = mkFxCtl({ label: "阈值", tip: "压缩阈值", kind: "db", bipolar: true,
      min: -60, max: 0, step: 1, init: 0,
      onChange: (v) => { track.compTh = v; applyTrackFx(track); } });
    const compRatioEl = mkFxCtl({ label: "比率", tip: "压缩比率", kind: "ratio",
      min: 1, max: 20, step: 0.5, init: 1,
      onChange: (v) => { track.compRatio = v; applyTrackFx(track); } });
    // 回声：默认全中性（混合 0 即关闭）；延迟 0 = 自动用 FX_ECHO_DEF_MS（与后端兜底一致）；
    // 反馈上限 0.95（避免无限堆积）
    const echoDelayEl = mkFxCtl({ label: "延迟", tip: "延迟（0 = 自动 250ms）", kind: "ms", shape: "fader",
      min: 0, max: 2000, step: 10, init: 0,
      onChange: (v) => { track.echoDelay = v; applyTrackFx(track); } });
    const echoFbEl = mkFxCtl({ label: "反馈", tip: "反馈", kind: "fb", shape: "fader",
      min: 0, max: 0.95, step: 0.05, init: 0,
      onChange: (v) => { track.echoFb = v; applyTrackFx(track); } });
    const echoMixEl = mkFxCtl({ label: "混合", tip: "回声混合比例", kind: "pct", shape: "fader",
      min: 0, max: 1, step: 0.05, init: 0,
      onChange: (v) => { track.echoMix = v; applyTrackFx(track); } });
    eqRowA.append(eqLowEl.el, eqMidEl.el, eqHighEl.el);
    eqRowB.append(hpfEl.el, lpfEl.el, panEl.el);
    dynKnobs.append(compThEl.el, compRatioEl.el);
    echoRow.append(echoDelayEl.el, echoFbEl.el, echoMixEl.el);
    // 面板两端各挂一块表：IN 在音质模块左侧，OUT 在回声模块右侧
    const mtrIn = mkMeterBlock("IN"), mtrOut = mkMeterBlock("OUT");
    fxPanel.prepend(mtrIn.wrap);
    fxPanel.appendChild(mtrOut.wrap);

    const cv = document.createElement("canvas");
    cv.className = "wave";
    // 播放头覆盖层：绝对定位竖线，跟随统一播放进度（避免每帧重绘 canvas）
    const ph = document.createElement("div");
    ph.className = "playhead";
    const waveWrap = document.createElement("div");
    waveWrap.className = "wave-wrap";
    waveWrap.appendChild(cv);
    waveWrap.appendChild(ph);
    wrap.appendChild(head);
    wrap.appendChild(fxPanel);
    wrap.appendChild(waveWrap);
    box.appendChild(wrap);

    const track = {
      key: item.type || ("track" + (i + 1)), label: item.label || item.name,
      path: item.path, name: item.name, gain: 0, mute: false, solo: false,
      fadeIn: 0, fadeOut: 0, clips: [], peaks: [], canvas: cv, stateEl: stateEl,
      gainEl: gain, gainValEl: gainVal, muteEl: mute, soloEl: solo,
      finEl: fin, foutEl: fout, playheadEl: ph, node: null,
      // 音质（P1）/音效（P2）：参数值 + 对应控件；fx 为播放时建立的节点链（未播放时为 null）
      pan: 0, eqLow: 0, eqMid: 0, eqHigh: 0, hpf: 0, lpf: 0, fx: null,
      compTh: 0, compRatio: 1, echoDelay: 0, echoFb: 0, echoMix: 0,
      // 旁通：false = 本轨全部音质/音效不生效（旋钮数值保留，便于 A/B 与恢复）
      // fxToolsPaint 在 paintBypass 定义之后再挂（此处不能引用，const 存在暂时性死区）
      fxOn: true, fxToolsPaint: null,
      // FX 控件（工程回灌时调用其 setV，见 applyTrackState）
      panEl: panEl, eqLowEl: eqLowEl, eqMidEl: eqMidEl,
      eqHighEl: eqHighEl, hpfEl: hpfEl, lpfEl: lpfEl,
      compThEl: compThEl, compRatioEl: compRatioEl,
      echoDelayEl: echoDelayEl, echoFbEl: echoFbEl, echoMixEl: echoMixEl,
      // 可视化：EQ 曲线画布、四张表 + GR 表的 DOM 与显示状态；meter 为播放时建立的取样链（未播放时为 null）
      eqCanvas: eqCv,
      mtrEl: { inL: mtrIn.L, inR: mtrIn.R, outL: mtrOut.L, outR: mtrOut.R, gr: grCol },
      mtr: null, meter: null,
    };
    S.tracks.push(track);
    // 曲线：绑定手柄拖拽（改 gain）并首次绘制
    attachEqCurve(track, eqCv);
    drawEqCurve(track);

    // —— 「归零」目标：音质 6 项 / 压缩 2 项 / 回声 3 项（点击后该模块全部回到中性值） ——
    eqResets.push(panEl.resetV, eqLowEl.resetV, eqMidEl.resetV,
                  eqHighEl.resetV, hpfEl.resetV, lpfEl.resetV);
    dynResets.push(compThEl.resetV, compRatioEl.resetV);
    echoResets.push(echoDelayEl.resetV, echoFbEl.resetV, echoMixEl.resetV);

    // —— FX 工具模块（靠右停靠）：旁通开关 / FX 预设 / 复制 FX 到其他轨 ——
    const toolBody = mkMod("tool", "FX 工具");
    const ftRow = (labelKey) => {
      const r = document.createElement("div"); r.className = "ftrow";
      const l = document.createElement("span"); l.className = "ftlbl"; l.textContent = T(labelKey);
      const sel = document.createElement("select"); sel.className = "ftsel";
      const btn = document.createElement("button");
      btn.type = "button"; btn.className = "ftbtn";
      r.append(l, sel, btn);
      toolBody.appendChild(r);
      return { sel: sel, btn: btn };
    };
    // 第 1 行：旁通开关（只影响音频链与导出，不动旋钮数值，便于 A/B 对比）
    const byRow = document.createElement("div"); byRow.className = "ftrow";
    const byLbl = document.createElement("span");
    byLbl.className = "ftlbl"; byLbl.textContent = T("开关");
    const byBtn = document.createElement("button");
    byBtn.type = "button"; byBtn.className = "ftbtn wfull";
    byRow.append(byLbl, byBtn);
    toolBody.appendChild(byRow);
    const paintBypass = () => {
      byBtn.classList.toggle("on", track.fxOn === false);
      byBtn.textContent = track.fxOn === false ? T("旁通") : T("正常");
      byBtn.title = T("旁通本轨全部音质与音效");
      fxPanel.classList.toggle("fx-off", track.fxOn === false);
    };
    track.fxToolsPaint = paintBypass;           // 挂到轨道对象：复制 FX / 工程回灌时刷新按钮状态
    byBtn.addEventListener("click", () => {
      track.fxOn = track.fxOn === false;        // 取反（默认 true = 正常）
      paintBypass();
      applyTrackFx(track);
    });
    // 第 2 行：FX 预设（内置 + 自定义）+ 应用；选「保存为预设…」则把当前轨参数存为自定义预设
    const preRow = ftRow("预设");
    preRow.btn.textContent = T("应用");
    const paintPresets = () => {
      const keep = preRow.sel.value;
      preRow.sel.textContent = "";
      const opt = (val, text) => {
        const o = document.createElement("option"); o.value = val; o.textContent = text;
        preRow.sel.appendChild(o);
      };
      FX_PRESET_BUILTIN.forEach((p) => opt("b:" + p.id, T(p.name)));
      loadCustomPresets().forEach((p) => opt("c:" + p.name, p.name));
      opt("__save__", T("保存为预设…"));
      preRow.sel.value = keep && preRow.sel.querySelector('option[value="' + keep + '"]')
        ? keep : ("b:" + FX_PRESET_BUILTIN[0].id);
    };
    preRow.btn.addEventListener("click", () => {
      const v = preRow.sel.value || "";
      if (v === "__save__") {                   // 保存当前轨参数为自定义预设
        const name = (window.prompt(T("预设名称"), "") || "").trim();
        if (!name) { paintPresets(); return; }
        saveCustomPreset(name, collectTrackFx(track));
        paintPresets();
        preRow.sel.value = "c:" + name;
        return;
      }
      let p = null;
      if (v.indexOf("b:") === 0) {
        const b = FX_PRESET_BUILTIN.find((x) => x.id === v.slice(2));
        if (b) p = presetToParams(b.v);
      } else if (v.indexOf("c:") === 0) {
        const c = loadCustomPresets().find((x) => x.name === v.slice(2));
        if (c) p = presetToParams(c.v);
      }
      if (p) setTrackFx(track, p);
    });
    // 第 3 行：复制 FX 到其他轨（下拉在展开前重建，保证轨道列表是最新的）
    const cpRow = ftRow("复制到");
    cpRow.btn.textContent = T("复制");
    const paintTargets = () => {
      const keep = cpRow.sel.value;
      cpRow.sel.textContent = "";
      const opt = (val, text) => {
        const o = document.createElement("option"); o.value = val; o.textContent = text;
        cpRow.sel.appendChild(o);
      };
      S.tracks.forEach((o) => { if (o !== track) opt(o.key, o.label); });
      if (S.tracks.length > 1) opt("__all__", T("全部其他轨"));
      if (keep && cpRow.sel.querySelector('option[value="' + keep + '"]')) cpRow.sel.value = keep;
    };
    cpRow.sel.addEventListener("mousedown", paintTargets);
    cpRow.sel.addEventListener("focus", paintTargets);
    cpRow.btn.addEventListener("click", () => {
      const v = cpRow.sel.value || "";
      if (!v) return;
      const p = collectTrackFx(track);
      const targets = v === "__all__"
        ? S.tracks.filter((o) => o !== track)
        : S.tracks.filter((o) => o !== track && o.key === v);
      targets.forEach((o) => {
        setTrackFx(o, p);
        o.fxOn = track.fxOn;                    // 旁通状态一并复制
        if (o.fxToolsPaint) o.fxToolsPaint();
      });
    });
    paintBypass();
    paintPresets();
    paintTargets();

    // 增益：滑块、± 步进按钮、数值徽标三者共用同一写值入口，始终保持一致
    const setGain = (v) => {
      track.gain = clampNum(r3(Number(v) || 0), -30, 12);
      gain.value = String(track.gain);
      gainVal.textContent = track.gain.toFixed(1) + " dB";
      applyTrackGain(track);                    // 播放中调增益即时生效
    };
    gain.addEventListener("input", () => setGain(gain.value));
    gDown.addEventListener("click", () => setGain(track.gain - 0.5));
    gUp.addEventListener("click", () => setGain(track.gain + 0.5));
    mute.addEventListener("change", () => { track.mute = mute.checked; applyTrackGain(track); });
    solo.addEventListener("change", () => {
      track.solo = solo.checked;
      S.tracks.forEach(applyTrackGain);         // Solo 影响全部轨的发声门控
    });
    fin.addEventListener("change", () => { track.fadeIn = Math.max(0, parseFloat(fin.value) || 0); });
    fout.addEventListener("change", () => { track.fadeOut = Math.max(0, parseFloat(fout.value) || 0); });
    trimBtn.addEventListener("click", () => {
      const a = S.sel[0], b = S.sel[1];
      if (!(b > a)) { setMsg(T("区间无效"), "err"); return; }
      track.clips = [{ start: a, in: a, out: b, fade_in: track.fadeIn, fade_out: track.fadeOut }];
      updateTrackState(track); drawTrack(track);
    });
    resetBtn.addEventListener("click", () => {
      track.clips = []; updateTrackState(track); drawTrack(track);
    });
    attachSelection(cv);
  });
}

/* ============================================================== 单轨试听 */
/* 共享一个隐藏 audio 元素播放单轨原文件（/api/mix/audio），并用 Web Audio 的
   GainNode 套用该轨增益——audio.volume 只能衰减（0~1），无法表达 +12dB。
   AudioContext 延迟到首次点击才创建，以满足浏览器"必须用户手势"的限制。
   按钮符号由播放器事件统一刷新（按 currentSrc 匹配归属轨）：切换轨道时改 src
   会异步触发 pause 事件，若靠手工维护按钮标记会导致两个按钮同时显示 ⏸。 */
let _pvCtx = null, _pvGain = null, _pvFx = null;
function syncPreviewButtons() {
  const el = $("solo-audio");
  const cur = el.paused ? "" : (el.currentSrc || "");
  document.querySelectorAll("#tracks .track button.pl").forEach((b) => {
    b.textContent = (cur && b.dataset.path && cur.includes(b.dataset.path)) ? "⏸" : "▶";
  });
}
function previewTrack(t) {
  const el = $("solo-audio");
  // 正在播放本轨 → 再点一次 = 停止
  if (!el.paused && el.currentSrc && el.currentSrc.includes(enc(t.path))) {
    el.pause();
    return;
  }
  stopPlayback();          // 单轨试听与统一播放互斥，避免两路声音叠加
  try {
    if (!_pvCtx) {                                            // 首次点击才建上下文
      _pvCtx = new (window.AudioContext || window.webkitAudioContext)();
      _pvGain = _pvCtx.createGain();
      _pvFx = buildFxChain(_pvCtx);                           // 试听同样套用该轨音质
      _pvCtx.createMediaElementSource(el).connect(_pvFx.head);
      _pvFx.tail.connect(_pvGain).connect(_pvCtx.destination);
    }
    _pvCtx.resume();
    _pvGain.gain.value = Math.pow(10, (Number(t.gain) || 0) / 20);  // dB → 线性增益
    applyFxParams(_pvCtx, _pvFx.nodes, t);
    el.src = "/api/mix/audio?path=" + enc(t.path);
    el.play().catch(() => syncPreviewButtons());
  } catch (e) { /* 播放失败静默处理：不阻断编辑 */ }
}

/* ================================================ FX 控件（旋钮 / 推子 / 数值徽标） */
/* 专业效果器风格的参数控件。设计要点：
   - 值由闭包持有，皮肤（SVG 旋钮 / CSS 推子）与只读数值徽标由 paint() 统一刷新；
   - 数值徽标双击原地换成 <input type="number"> 精确录入（Enter/失焦提交，Esc 取消）；
   - 交互：上下拖拽（Shift 精调 1/5）、滚轮 1 档、双击盘面复位中性值、聚焦后 ↑↓/PageUp/Home；
   - 一律量化到 step，与「步进」语义一致，避免连续浮点漂移导致数值不可读。
   形态：shape="knob"（默认，连续比例量）/ shape="fader"（时间·强度类，纵向推子）。 */
const KNOB_SWEEP = 270, KNOB_A0 = -135, KNOB_C = 20, KNOB_R = 15.5;  // 行程 -135°…+135°（12 点方向为 0°）
/* 旋钮极坐标 → SVG 坐标（viewBox 40×40，圆心 20,20） */
function knobXY(r, deg) {
  const rad = (deg - 90) * Math.PI / 180;
  return [KNOB_C + r * Math.cos(rad), KNOB_C + r * Math.sin(rad)];
}
/* 值弧 path：从 a0 到 a1（度）；两角重合时返回空串（不画弧） */
function arcPath(r, a0, a1) {
  if (Math.abs(a1 - a0) < 0.6) return "";
  const p0 = knobXY(r, a0), p1 = knobXY(r, a1);
  const large = Math.abs(a1 - a0) > 180 ? 1 : 0;
  return "M" + p0[0].toFixed(2) + " " + p0[1].toFixed(2) + "A" + r + " " + r + " 0 " +
    large + " " + (a1 > a0 ? 1 : 0) + " " + p1[0].toFixed(2) + " " + p1[1].toFixed(2);
}
/* 数值徽标文案：按类型给单位与精度（Hz 超 1k 折成 k；0 = 关闭的显示 OFF） */
function fmtFxVal(v, kind) {
  switch (kind) {
    case "db": return (v > 0 ? "+" : "") + v.toFixed(1) + " dB";
    case "hz": return v <= 0 ? "OFF" : (v >= 1000 ? (v / 1000).toFixed(1) + "k" : String(Math.round(v))) + " Hz";
    case "ratio": return v.toFixed(1) + ":1";
    case "ms": return Math.round(v) + " ms";
    case "fb": return v.toFixed(2);
    case "pct": return Math.round(v * 100) + "%";
    case "pan": return fmtPan(v);
    default: return String(v);
  }
}
/* 建一个 FX 参数控件。
   opt = {label, min, max, step, init, neutral, kind, tip, bipolar, shape, onChange}
   返回 {el, setV, getV}：setV 供工程回灌（只刷新显示，不广播 onChange）。 */
function mkFxCtl(opt) {
  const min = opt.min, max = opt.max, step = opt.step;
  const neutral = opt.neutral === undefined ? opt.init : opt.neutral;
  const isFader = opt.shape === "fader";
  let cur = clampNum(opt.init, min, max);

  const box = document.createElement("div");
  box.className = isFader ? "fd" : "kb";
  box.tabIndex = 0;                              // 可聚焦 → 键盘可调值（空格仍是全局热键）
  box.title = T(opt.tip || opt.label);

  const skin = document.createElement("div");
  skin.className = isFader ? "fd-t" : "kb-d";
  let arc = null, ptr = null, fill = null, knob = null;
  if (isFader) {
    fill = document.createElement("div"); fill.className = "fd-f";
    knob = document.createElement("div"); knob.className = "fd-k";
    skin.append(fill, knob);
  } else {
    // 盘面 = 刻度（±135°/±90°/0° 三档标记）+ 行程弧（暗）+ 值弧（模块色）+ 指针 + 中心盖
    const ticks = [-135, -90, 0, 90, 135].map((deg) => {
      const p0 = knobXY(17.6, deg), p1 = knobXY(19.6, deg);
      return '<line class="kb-tk" x1="' + p0[0].toFixed(2) + '" y1="' + p0[1].toFixed(2) +
        '" x2="' + p1[0].toFixed(2) + '" y2="' + p1[1].toFixed(2) + '"></line>';
    }).join("");
    skin.innerHTML = '<svg viewBox="0 0 40 40" aria-hidden="true">' + ticks +
      '<circle class="kb-ring" cx="' + KNOB_C + '" cy="' + KNOB_C + '" r="' + KNOB_R + '"></circle>' +
      '<path class="kb-track"></path>' +
      '<path class="kb-arc"></path>' +
      '<line class="kb-ptr" x1="' + KNOB_C + '" y1="' + KNOB_C + '" x2="' + KNOB_C +
      '" y2="' + (KNOB_C - KNOB_R + 2.5) + '"></line>' +
      '<circle class="kb-cap" cx="' + KNOB_C + '" cy="' + KNOB_C + '" r="2.4"></circle></svg>';
    arc = skin.querySelector(".kb-arc"); ptr = skin.querySelector(".kb-ptr");
    // 行程弧固定画满整程（中性值时也能看出可调范围）
    skin.querySelector(".kb-track").setAttribute("d", arcPath(KNOB_R, KNOB_A0, KNOB_A0 + KNOB_SWEEP));
  }
  const lab = document.createElement("div");
  lab.className = isFader ? "fd-l" : "kb-l"; lab.textContent = T(opt.label);
  // 数值徽标：常态只读文本（不占焦点），双击换成输入框
  const val = document.createElement("div");
  val.className = isFader ? "fd-v" : "kb-v";
  box.append(skin, lab, val);

  const t0 = (neutral - min) / (max - min);      // 中性值在行程上的比例
  const angle = (ratio) => KNOB_A0 + ratio * KNOB_SWEEP;
  const ratio = () => (cur - min) / (max - min);
  const snap = (v) => clampNum(r3(Math.round(v / step) * step), min, max);

  /* 刷新皮肤与徽标（不广播 onChange） */
  function paint() {
    val.textContent = fmtFxVal(cur, opt.kind);
    if (isFader) {
      fill.style.height = (ratio() * 100) + "%";
      knob.style.setProperty("--pos", ratio().toFixed(4));
    } else {
      ptr.setAttribute("transform", "rotate(" + angle(ratio()).toFixed(2) + " " + KNOB_C + " " + KNOB_C + ")");
      // 双极参数从中性点向两侧生长，单极从最小端生长
      const base = opt.bipolar ? t0 : 0;
      const a0 = Math.min(base, ratio()), a1 = Math.max(base, ratio());
      arc.setAttribute("d", arcPath(KNOB_R, angle(a0), angle(a1)));
    }
  }
  /* 写值：量化 → 刷新 → 值真变化且 notify 时广播（实时预览 / 写回 track） */
  function set(v, notify) {
    const nv = snap(Number(v) || 0);
    const changed = nv !== cur;
    cur = nv; paint();
    if (changed && notify) opt.onChange(cur);
    return changed;
  }
  /* 数值徽标双击 → 原地精确录入 */
  function beginEdit() {
    const inp = document.createElement("input");
    inp.type = "number"; inp.className = "fxnum";
    inp.min = String(min); inp.max = String(max); inp.step = String(step);
    inp.value = String(r3(cur));
    let settled = false;
    const finish = (commit) => {
      if (settled) return;
      settled = true;
      if (commit) set(parseFloat(inp.value) || 0, true);
      inp.replaceWith(val);                     // 无论提交与否都还原为文本徽标
    };
    inp.addEventListener("blur", () => finish(true));
    inp.addEventListener("keydown", (ev) => {
      if (ev.code === "Enter") { ev.preventDefault(); finish(true); }
      else if (ev.code === "Escape") { ev.preventDefault(); finish(false); }
    });
    val.replaceWith(inp);
    inp.focus(); inp.select();
  }

  // —— 拖拽：旋钮按垂直位移换算（拖满约 180px），推子按轨道内绝对位置（点击跳转 + 拖动） ——
  let drag = null;
  skin.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0) return;
    ev.preventDefault();
    try { skin.setPointerCapture(ev.pointerId); } catch (e) { /* 指针不可捕获时退化为普通拖拽 */ }
    if (isFader) {
      const rect = skin.getBoundingClientRect();
      const at = (cy) => min + clampNum(1 - (cy - rect.top) / rect.height, 0, 1) * (max - min);
      drag = { y: ev.clientY, at: at };
      set(at(ev.clientY), true);
    } else {
      drag = { y: ev.clientY, v: cur };
    }
  });
  skin.addEventListener("pointermove", (ev) => {
    if (!drag) return;
    if (drag.at) { set(drag.at(ev.clientY), true); return; }
    const span = (max - min) / (ev.shiftKey ? 900 : 180);
    set(drag.v + (drag.y - ev.clientY) * span, true);
  });
  const endDrag = (ev) => {
    if (!drag) return;
    drag = null;
    try { skin.releasePointerCapture(ev.pointerId); } catch (e) { /* 指针已释放 */ }
  };
  skin.addEventListener("pointerup", endDrag);
  skin.addEventListener("pointercancel", endDrag);
  skin.addEventListener("dblclick", () => set(neutral, true));
  skin.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    set(cur + (ev.deltaY < 0 ? step : -step), true);
  }, { passive: false });
  val.addEventListener("dblclick", beginEdit);
  // 键盘：↑↓ 一档、Shift 五档、PageUp/Down 十分之一行程、Home 复位
  box.addEventListener("keydown", (ev) => {
    const big = ev.shiftKey ? 5 : 1;
    let d = 0;
    if (ev.code === "ArrowUp" || ev.code === "ArrowRight") d = step * big;
    else if (ev.code === "ArrowDown" || ev.code === "ArrowLeft") d = -step * big;
    else if (ev.code === "PageUp") d = (max - min) / 10;
    else if (ev.code === "PageDown") d = -(max - min) / 10;
    else if (ev.code === "Home") { ev.preventDefault(); set(neutral, true); return; }
    else return;
    ev.preventDefault();
    set(cur + d, true);
  });

  paint();
  return {
    el: box,
    setV: (v) => set(v, false),                  // 仅刷新显示（工程回灌用，不广播）
    getV: () => cur,
    resetV: () => set(neutral, true),            // 复位到中性值并广播（模块「归零」按钮用）
  };
}

/* ========================================================== 统一播放（transport） */
/* 标准 DAW 播放逻辑：
   1) 所有轨共用一个 AudioContext 与同一个 start(t0) 调度 → 同一时钟、样本级同步，
      只有一套播放/暂停/停止（不再每轨各播各的）；
   2) 发声规则与后端渲染一致：任一轨 Solo → 只听 Solo 轨，否则 Mute 轨静音，其余发声；
   3) 播放即复现编辑结果：裁切（clips）、淡入淡出、增益、Mute/Solo 全部实时生效；
   4) 有全局选区只播选区，无选区播整曲。
   AudioContext 延迟到首次播放才创建（浏览器要求用户手势）。 */
function audioCtx() {
  if (!S.ctx) {
    S.ctx = new (window.AudioContext || window.webkitAudioContext)();
    S.master = S.ctx.createGain();
    S.master.connect(S.ctx.destination);
  }
  return S.ctx;
}
function linGain(db) { return Math.pow(10, (Number(db) || 0) / 20); }

/* —— 每轨音质（P1）+ 音效（P2）：声像 / 三段 EQ / 高通·低通 / 压缩 / 回声 ——
   与后端 mix_render._fx_filters 一一对应，保证「听到什么就导出什么」：
   声像用 Web Audio StereoPannerNode 的等功率算法（后端用同公式生成 pan 滤镜），
   高通/低通为 12dB/oct Butterworth（后端 width=0.707），EQ 节点频率与后端一致；
   压缩对应后端 acompressor（阈值/比率/固定 attack-release-knee）；
   回声对应后端 aecho：3 条并联延迟线（fb¹/fb²/fb³），干声直通不衰减。
   后端处理顺序为 高通→低通→EQ→声像→压缩→回声，前端链顺序保持一致。 */
const FX_HPF_OFF = 20;        // 高通"关闭"时的等效频率（<20Hz 不可闻，等同旁通）
const FX_LPF_OFF = 22050;     // 低通"关闭"时的等效频率（超出可听带，等同旁通）
const FX_Q = 0.7071;          // 12dB/oct Butterworth
const FX_ECHO_TAPS = 3;       // 回声抽头数（与后端 _ECHO_TAPS 一致）
const FX_DELAY_MAX = 2.0;     // 单条延迟线上限（秒），覆盖后端 0~2000ms
const FX_ECHO_DEF_MS = 250;   // 混合 > 0 但延迟未填时的兜底（与后端一致）
const FX_COMP_ATTACK = 0.02;  // 压缩启动（秒）= 后端 attack 20ms
const FX_COMP_RELEASE = 0.25; // 压缩释放（秒）= 后端 release 250ms
const FX_COMP_KNEE = 6;       // 压缩拐点（dB）= 后端 knee
/* —— FX 参数白名单 + 中性值（归零 / 预设 / 复制 三处的唯一真源） ——
   键名与 track 上的字段同名，键序即「音质 → 压缩 → 回声」的处理顺序。 */
const FX_FIELDS = ["pan", "eqLow", "eqMid", "eqHigh", "hpf", "lpf",
  "compTh", "compRatio", "echoDelay", "echoFb", "echoMix"];
const FX_NEUTRAL = { pan: 0, eqLow: 0, eqMid: 0, eqHigh: 0, hpf: 0, lpf: 0,
  compTh: 0, compRatio: 1, echoDelay: 0, echoFb: 0, echoMix: 0 };
